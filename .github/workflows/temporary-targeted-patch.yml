name: Temporary targeted discovery patch

on:
  push:
    branches:
      - fix/usa-budget-foreign-domain

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usa-budget-foreign-domain
      - name: Apply targeted patch
        shell: python
        run: |
          from pathlib import Path

          p = Path("worker/index.js")
          s = p.read_text()

          old = '''const JUNK_HOST_RE = /(?:facebook|instagram|linkedin|youtube|tiktok|pinterest|x\\.com|twitter|wikipedia|yelp|tripadvisor)\\./i;'''
          new = old + '''\nconst FOREIGN_GOV_HOST_RE = /(?:^|\\.)(?:gov|gouv|government|gc|ac)\\.(?:co|uk|au|nz|ca|in|pk|bd|za|ng|ke|br|mx|fr|de|es|it|nl|be|ch|at|pl|se|no|dk|fi|jp|kr|sg|my|ph|id|th|vn)$/i;'''
          assert s.count(old) == 1, "JUNK_HOST_RE anchor not found exactly once"
          s = s.replace(old, new)

          old = '''      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (!urls.some(v => urlKey(v) === urlKey(x.href))) urls.push(x.href);'''
          new = '''      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;\n      if (!urls.some(v => urlKey(v) === urlKey(x.href))) urls.push(x.href);'''
          assert s.count(old) == 1, "searchWeb host filter anchor not found exactly once"
          s = s.replace(old, new)

          old = '''function buildUSAQueries(interests) {\n  const broad = [\n    "maintenance facilities technician laborer mechanic equipment",\n    "trades fabrication welder woodworking technician",\n    "transportation warehouse material handling",\n    "parks recreation natural resources",\n    "cultural resources museum historic preservation archaeology"\n  ];\n  const interestQueries = interests.slice(0, 4).map(x => clean(x)).filter(Boolean);\n  return [...new Set([...broad, ...interestQueries])].slice(0, 8);\n}'''
          new = '''function buildUSAQueries(interests) {\n  // Keep the federal discovery pass broad but bounded. Interest-specific web/job discovery\n  // remains available elsewhere; adding those interests to every USAJOBS anchor multiplied\n  // requests too aggressively and exhausted the shared fetch budget.\n  return [\n    "maintenance facilities technician laborer mechanic equipment",\n    "trades fabrication welder woodworking technician",\n    "transportation warehouse material handling",\n    "parks recreation natural resources",\n    "cultural resources museum historic preservation archaeology"\n  ];\n}'''
          assert s.count(old) == 1, "buildUSAQueries block not found exactly once"
          s = s.replace(old, new)

          p.write_text(s)
      - name: Verify targeted diff
        shell: bash
        run: |
          git diff --check
          git diff -- worker/index.js
          test "$(git diff --numstat -- worker/index.js | awk '{print $1}')" = "6"
          test "$(git diff --numstat -- worker/index.js | awk '{print $2}')" = "3"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
      - name: Commit patched source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git rm .github/workflows/temporary-targeted-patch.yml
          git commit -m "fix: bound USAJOBS discovery and filter foreign gov hosts"
          git push origin HEAD:fix/usa-budget-foreign-domain

# Temporary workflow; removes itself after the targeted patch succeeds.
