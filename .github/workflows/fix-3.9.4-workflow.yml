name: Repair NEO-RLS geographic validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-3.9.4-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose NEO-RLS headings
        run: |
          node --input-type=module <<'JS'
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          const matches = [...html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>([\s\S]{0,12000}?)(?=<h2[^>]*>|$)/gi)];
          console.log('HTTP', r.status, 'bytes', html.length, 'H2 cards', matches.length);
          for (const m of matches.slice(0, 20)) console.log('H2:', m[1].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(), 'BLOCK:', m[2].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,180));
          JS
      - name: Patch and validate NEO-RLS parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          start = s.index('function parseNeoRlsJobs(')
          end = s.index('function parseJobs(', start)
          section = s[start:end]
          old = 'if (geo.score < 45 || (distance != null && distance > radius)) continue;'
          new = 'if ((geo.score < 45 && distance == null) || (distance != null && distance > radius)) continue;'
          if old not in section:
              raise SystemExit('NEO-RLS geographic rule not found')
          section = section.replace(old, new, 1)
          s = s[:start] + section + s[end:]
          s = s.replace('const VERSION = "3.9.5";', 'const VERSION = "3.9.6";', 1)
          s = s.replace('const BUILD = "v3.9.5-source-specific-job-event-repair";', 'const BUILD = "v3.9.6-neo-rls-geographic-acceptance";', 1)
          p.write_text(s)
          PY
          node --check worker/index.js
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs } from './worker/index.js';
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          const jobs = parseNeoRlsJobs(html, 'https://www.neo-rls.org/view_job_postings.php', ['museum','artifact conservation','historic preservation','archaeology','bike mechanic','welding','fabrication','woodworking','artisan','crafts'], 'Mesopotamia', 'OH', 30, {source:'NEO-RLS',partTime:true});
          console.log('PARSED JOBS', jobs.length);
          for (const j of jobs) console.log(JSON.stringify(j));
          if (jobs.length < 2) throw new Error('Expected at least 2 local part-time NEO-RLS jobs');
          JS
      - name: Commit validated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.6 fix NEO-RLS geographic validation" || exit 0
          git push origin main
