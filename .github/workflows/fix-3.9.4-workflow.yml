name: Repair NEO-RLS geographic validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-3.9.4-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply 3.9.6 geographic repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          replacements = {
              'if (new RegExp(`\\b${escapeRe(k.split(",")[0])}\\b`, "i").test(t)) return k;': 'if (new RegExp("\\\\b" + escapeRe(k.split(",")[0]) + "\\\\b", "i").test(t)) return k;',
              'const hasCity = city ? new RegExp(`\\b${escapeRe(norm(city))}\\b`, "i").test(t) : false;': 'const hasCity = city ? new RegExp("\\\\b" + escapeRe(norm(city)) + "\\\\b", "i").test(t) : false;',
              'const m = text.match(new RegExp(`.{0,80}\\b${escapeRe(city)}\\b.{0,80}`, "i"));': 'const m = text.match(new RegExp(".{0,80}\\\\b" + escapeRe(city) + "\\\\b.{0,80}", "i"));',
              'if (hardOutOfArea(combined, city, state) && !new RegExp(`\\b${escapeRe(city)}\\b`, "i").test(combined))': 'if (hardOutOfArea(combined, city, state) && !new RegExp("\\\\b" + escapeRe(city) + "\\\\b", "i").test(combined))'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          start = s.index('function parseNeoRlsJobs(')
          end = s.index('function parseJobs(', start)
          section = s[start:end]
          old = 'if (geo.score < 45 || (distance != null && distance > radius)) continue;'
          new = 'if ((geo.score < 45 && distance == null) || (distance != null && distance > radius)) continue;'
          if old not in section:
              raise SystemExit('NEO-RLS geographic condition not found')
          section = section.replace(old, new, 1)
          s = s[:start] + section + s[end:]
          s = s.replace('const VERSION = "3.9.5";', 'const VERSION = "3.9.6";', 1)
          s = s.replace('const BUILD = "v3.9.5-source-specific-job-event-repair";', 'const BUILD = "v3.9.6-neo-rls-geographic-validation";', 1)
          p.write_text(s)
          PY
          node --check worker/index.js
      - name: Validate geographic distance and live NEO-RLS jobs
        run: |
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs, estimateDistance } from './worker/index.js';
          if (estimateDistance('Mesopotamia, OH','Warren, OH') !== 18) throw new Error('Warren distance regression');
          if (estimateDistance('Mesopotamia, OH','Garrettsville, OH') !== 14) throw new Error('Garrettsville distance regression');
          if (estimateDistance('Mesopotamia, OH','Hudson, OH') !== 29) throw new Error('Hudson distance regression');
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          const jobs = parseNeoRlsJobs(html,'https://www.neo-rls.org/view_job_postings.php',['museum','artifact conservation','historic preservation','archaeology','bike mechanic','welding','fabrication','woodworking','artisan','crafts'],'Mesopotamia','OH',30,{source:'NEO-RLS',partTime:true});
          console.log('NEO-RLS HTTP',r.status,'bytes',html.length,'parsed',jobs.length);
          for (const j of jobs) console.log(j.title,'|',j.location,'|',j.distanceMiles,'mi');
          if (jobs.length < 5) throw new Error('Expected at least 5 local part-time NEO-RLS jobs within 30 miles');
          if (!jobs.some(j => /Warren/i.test(j.title+' '+j.location))) throw new Error('Missing Warren listing');
          if (!jobs.some(j => /Garrettsville/i.test(j.title+' '+j.location))) throw new Error('Missing Garrettsville listing');
          JS
      - name: Commit validated 3.9.6 worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.6 fix NEO-RLS geographic validation" || exit 0
          git push origin main
