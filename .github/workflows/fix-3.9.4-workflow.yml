name: Repair NEO-RLS geographic validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-3.9.4-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose source parser filters
        run: |
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs, estimateDistance, geographicEvidence } from './worker/index.js';
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          const ms = [...html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>([\s\S]{0,12000}?)(?=<h2[^>]*>|$)/gi)];
          console.log('H2', ms.length);
          for (const m of ms.slice(0,16)) {
            const title = m[1].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
            const block = m[2].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
            const combined = title + ' ' + block;
            console.log(JSON.stringify({title,partTime:/part[- ]?time|\b\d{1,2}\s*(?:-|to)\s*\d{1,2}\s*hours?\b|\b(?:12|15|16|18|20|24|25|30|32)\s*hours?\b|hourly/i.test(combined),distance:estimateDistance('Mesopotamia, OH',combined),geo:geographicEvidence(combined,'Mesopotamia','OH').score}));
          }
          console.log('PARSER partTime=true', parseNeoRlsJobs(html,'https://www.neo-rls.org/view_job_postings.php',[], 'Mesopotamia','OH',30,{source:'NEO-RLS',partTime:true}).length);
          console.log('PARSER partTime=false', parseNeoRlsJobs(html,'https://www.neo-rls.org/view_job_postings.php',[], 'Mesopotamia','OH',30,{source:'NEO-RLS',partTime:false}).length);
          JS
      - name: Validate syntax
        run: node --check worker/index.js
