name: Fix 3.9.4 workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-3.9.4-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix replacement callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-3.9.4.yml')
          s = p.read_text()
          s = s.replace("s2, n1 = event_pattern.subn(event_fn + '\\nfunction relevanceScore', s, count=1)", "s2, n1 = event_pattern.subn(lambda _: event_fn + '\\nfunction relevanceScore', s, count=1)")
          s = s.replace("s3, n2 = job_pattern.subn(job_fn + '\\nfunction looksLikeJobTitle', s2, count=1)", "s3, n2 = job_pattern.subn(lambda _: job_fn + '\\nfunction looksLikeJobTitle', s2, count=1)")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-3.9.4.yml
          git commit -m "Fix parser repair workflow replacement" || exit 0
          git push origin main
