name: Repair NEO-RLS geographic validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-3.9.4-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair dynamic geographic regexes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          replacements = {
              'if (new RegExp(`\\b${escapeRe(k.split(",")[0])}\\b`, "i").test(t)) return k;': 'if (new RegExp("\\\\b" + escapeRe(k.split(",")[0]) + "\\\\b", "i").test(t)) return k;',
              'const hasCity = city ? new RegExp(`\\b${escapeRe(norm(city))}\\b`, "i").test(t) : false;': 'const hasCity = city ? new RegExp("\\\\b" + escapeRe(norm(city)) + "\\\\b", "i").test(t) : false;',
              'const hasCity = city ? new RegExp(`\\b${escapeRe(norm(city))}\\b`, "i").test(t) : false;': 'const hasCity = city ? new RegExp("\\\\b" + escapeRe(norm(city)) + "\\\\b", "i").test(t) : false;',
              'const m = text.match(new RegExp(`.{0,80}\\b${escapeRe(city)}\\b.{0,80}`, "i"));': 'const m = text.match(new RegExp(".{0,80}\\\\b" + escapeRe(city) + "\\\\b.{0,80}", "i"));',
              'if (hardOutOfArea(combined, city, state) && !new RegExp(`\\b${escapeRe(city)}\\b`, "i").test(combined))': 'if (hardOutOfArea(combined, city, state) && !new RegExp("\\\\b" + escapeRe(city) + "\\\\b", "i").test(combined))'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if 'new RegExp("\\\\b" + escapeRe(k.split(",")[0]) + "\\\\b", "i")' not in s:
              raise SystemExit('cityKey regex repair did not apply')
          p.write_text(s)
          PY
          node --check worker/index.js
      - name: Test geographic distance and NEO-RLS parser
        run: |
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs, estimateDistance } from './worker/index.js';
          const dw = estimateDistance('Mesopotamia, OH','Warren, OH');
          const dg = estimateDistance('Mesopotamia, OH','Garrettsville, OH');
          const dh = estimateDistance('Mesopotamia, OH','Hudson, OH');
          console.log('Distances:', { Warren: dw, Garrettsville: dg, Hudson: dh });
          if (dw !== 18 || dg !== 14 || dh !== 29) throw new Error('Distance regression detected');
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          const jobs = parseNeoRlsJobs(html,'https://www.neo-rls.org/view_job_postings.php',['museum','artifact conservation','historic preservation','archaeology','bike mechanic','welding','fabrication','woodworking','artisan','crafts'],'Mesopotamia','OH',30,{source:'NEO-RLS',partTime:true});
          console.log('NEO-RLS parsed jobs:', jobs.length);
          for (const j of jobs) console.log(j.title,'|',j.location,'|',j.distanceMiles,'mi');
          if (jobs.length < 5) throw new Error('Expected at least 5 local part-time NEO-RLS jobs within 30 miles');
          if (!jobs.some(j => /Warren/i.test(j.title+' '+j.location))) throw new Error('Missing Warren job');
          if (!jobs.some(j => /Garrettsville/i.test(j.title+' '+j.location))) throw new Error('Missing Garrettsville job');
          JS
      - name: Commit validated 3.9.6 worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.6 fix geographic distance regexes" || exit 0
          git push origin main
