name: Apply local organization fix
on:
  push:
    branches: [fix/org-dance-and-local-noise]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = 'const DANCE_RE = /\\bdance\\b|dancing|ballroom|ballet|tap dance|jazz dance|dance studio|dance academy/i;'
          new = old + '\nconst ORG_DANCE_RE = /(?:dance studio|dance academy|dance school|dance company|dance troupe|ballroom studio|ballet school|ballet academy|tap dance studio|jazz dance studio|dance club)/i;'
          if old not in s or 'const ORG_DANCE_RE' in s:
              raise SystemExit('dance constant anchor missing or patch already applied')
          s = s.replace(old, new, 1)
          s = s.replace('const ORG_RE = /(?:association|society|club|guild|chapter|council|league|organization|organisation|foundation|historical society|heritage|museum|library|conservancy|preservation|collective|fellowship|alliance|coalition|volunteer group|chapter)/i;',
                        'const ORG_RE = /(?:association|society|club|guild|chapter|council|league|organization|organisation|foundation|historical society|heritage|museum|library|conservancy|preservation|collective|fellowship|alliance|coalition|volunteer group|shire|barony|SCA|living history)/i;', 1)
          s = s.replace('const ORG_IDENTITY_RE = /(?:association|society|club|guild|chapter|council|league|organization|organisation|foundation|conservancy|preservation|collective|fellowship|alliance|coalition|volunteer group)/i;',
                        'const ORG_IDENTITY_RE = /(?:association|society|club|guild|chapter|council|league|organization|organisation|foundation|conservancy|preservation|collective|fellowship|alliance|coalition|volunteer group|shire|barony|SCA|living history)/i;', 1)
          old_line = 'if (DANCE_RE.test(`${title} ${desc}`)) return { organizations: [], evidence, rejectReason: "dance exclusion" };'
          new_line = 'if (ORG_DANCE_RE.test(`${title} ${desc}`)) return { organizations: [], evidence, rejectReason: "dance exclusion" };'
          if old_line not in s:
              raise SystemExit('organization dance filter anchor missing')
          s = s.replace(old_line, new_line, 1)
          s = s.replace('const suffix = localSearchSuffix(state);\n    qs.push(`"${cats[i]}" ${p} Ohio (association OR society OR club OR guild OR chapter OR organization)${suffix}`);',
                        'const suffix = localSearchSuffix(state);\n    qs.push(`"${cats[i]}" ${p} (association OR society OR club OR guild OR chapter OR organization)${suffix}`);', 1)
          old_defaults = '["local history", "museums", "historical societies", "beekeeping", "blacksmithing", "reenactment", "traditional crafts", "nature", "native plants", "woodworking", "astronomy", "cycling", "clubs", "guilds"]'
          new_defaults = '["local history", "museums", "historical societies", "beekeeping", "blacksmithing", "reenactment", "living history", "SCA", "medieval reenactment", "traditional crafts", "nature", "native plants", "woodworking", "astronomy", "cycling", "clubs", "guilds", "sportsmen"]'
          if old_defaults not in s:
              raise SystemExit('interest defaults anchor missing')
          s = s.replace(old_defaults, new_defaults, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          git diff --check
          node --check worker/index.js
          git diff -- worker/index.js
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Improve local organization discovery filtering' || exit 0
          git push
