name: Job Prefetch Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Repair job prefetch gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text(encoding='utf-8')
          marker = 'function worthwhileJobCandidate(c, state) {'
          start = s.index(marker)
          brace = s.index('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('helper end not found')
          helper = '''function worthwhileJobCandidate(c, state) {
  const rawUrl = String(c?.url || "");
  const urlText = norm(rawUrl);
  if (SEARCH_NOISE_RE.test(urlText) || GENERIC_CONTENT_PATH_RE.test(rawUrl)) return false;
  if (JOB_REFERENCE_RE.test(urlText)) return false;
  if (JOB_JUNK_HOST_RE.test(host(rawUrl))) return false;
  if (!acceptDiscoveryUrl(rawUrl, state)) return false;
  // Search queries contain job and occupational words by design. Only the result URL
  // is used here so reference/educational pages are rejected before an expensive fetch.
  const pathSignal = /(?:\\bjobs?\\b|\\bcareers?\\b|\\bemployment\\b|\\bhiring\\b|\\brecruit(?:ment|ing)?\\b|\\bapply\\b|\\bapplication\\b|\\bopenings?\\b|\\bvacanc(?:y|ies)\\b|\\bpositions?\\b|\\bwork[-_ ]?with[-_ ]?(?:us|me)\\b|\\bjoin[-_ ]?(?:our|the)[-_ ]?team\\b|\\bopportunit(?:y|ies)\\b)/i.test(urlText);
  return CAREER_RE.test(urlText) || pathSignal;
}'''
          p.write_text(s[:start] + helper + s[end:], encoding='utf-8')
          PY
      - name: Validate Worker syntax
        run: node --check worker/index.js
      - name: Verify repair
        run: grep -q 'Search queries contain job and occupational words' worker/index.js
      - name: Commit repaired Worker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Require job-like URLs before job prefetch'
          git push origin HEAD:main
