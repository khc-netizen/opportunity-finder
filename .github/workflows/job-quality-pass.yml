name: Job Quality Pass

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Improve job candidate gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/index.js')
          s=p.read_text()
          old='const JOB_SIGNAL_RE = /\\b(?:job|jobs|career|careers|employment|hiring|position|apply|work|technician|welder|welding|fabricat|mechanic|warehouse|laborer|parks|grounds|recreation|museum|archaeology|custod|maintenance|delivery|transportation)\\b/i;'
          new='const JOB_SIGNAL_RE = /\\b(?:job|jobs|career|careers|employment|hiring|position|apply|application|work with us|join our team|job openings|vacancy|vacancies|technician|welder|welding|fabricat|mechanic|warehouse|laborer|parks|grounds|recreation|museum|archaeology|custod|maintenance|delivery|transportation)\\b/i;\nconst JOB_CONTENT_RE = /(?:\\bjob\\s+(?:opening|openings|posting|postings|opportunity|opportunities|listing|listings)\\b|\\b(?:career|careers)\\s+(?:page|site|portal|opportunities)\\b|\\bapply\\s+(?:now|today|online)\\b|\\bjoin\\s+(?:our|the)\\s+team\\b|\\bwork\\s+with\\s+(?:us|our)\\b|\\bemployment\\s+(?:opportunities|application|page)\\b|\\bcurrent\\s+(?:openings|vacancies)\\b)/i;\nconst JOB_REFERENCE_RE = /(?:wikihow|how-to|definition|what is|types of|learning center|learning-centre|guide|tutorial|dictionary|encyclopedia|article|blog|podcast|news|3d warehouse|power query)/i;'
          if old not in s: raise SystemExit('anchor not found')
          s=s.replace(old,new,1)
          marker='function worthwhileJobCandidate(c, state) {'
          if marker not in s: raise SystemExit('helper not found')
          start=s.index(marker)
          brace=s.index('{',start)
          depth=0; end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit('helper end not found')
          helper='''function worthwhileJobCandidate(c, state) {\n  const urlText = norm(c?.url || "");\n  const queryText = norm(c?.query || "");\n  const combined = `${urlText} ${queryText}`;\n  if (SEARCH_NOISE_RE.test(combined) || GENERIC_CONTENT_PATH_RE.test(String(c?.url || ""))) return false;\n  if (JOB_REFERENCE_RE.test(combined)) return false;\n  if (JOB_JUNK_HOST_RE.test(host(c?.url || ""))) return false;\n  if (!acceptDiscoveryUrl(c?.url || "", state)) return false;\n  const urlCareer = CAREER_RE.test(urlText);\n  const contentSignal = JOB_CONTENT_RE.test(combined);\n  const jobSignal = JOB_SIGNAL_RE.test(combined);\n  if (urlCareer || contentSignal) return true;\n  // A search result with only a generic occupational term is not worth an expensive fetch.\n  // Permit an employer-looking homepage only when the URL/query carries a strong job signal.\n  return jobSignal && /(?:jobs?|careers?|employment|hiring|work|team|apply|position|vacanc|opportunit)/i.test(combined);\n}'''
          s=s[:start]+helper+s[end:]
          p.write_text(s)
          PY
      - name: Validate Worker
        run: node --check worker/index.js
      - name: Verify patch
        run: |
          grep -q 'const JOB_CONTENT_RE' worker/index.js
          grep -q 'const JOB_REFERENCE_RE' worker/index.js
          grep -q 'JOB_REFERENCE_RE.test' worker/index.js
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Tighten job search candidate quality' || true
          git rm .github/workflows/job-quality-pass.yml
          git commit -m 'Remove one-time job quality workflow'
          git push origin HEAD:main
