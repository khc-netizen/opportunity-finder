name: Phase 3.9.4 parser repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-3.9.4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch worker parsers
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('worker/index.js')
          s = p.read_text()

          s = s.replace('const VERSION = "3.9.3";', 'const VERSION = "3.9.4";', 1)
          s = s.replace('const BUILD = "v3.9.3-local-job-and-event-parser";', 'const BUILD = "v3.9.4-job-event-parser-repair";', 1)

          event_fn = r'''function parseEvents(html, baseUrl, interests, city, state, org, radius = 75) {
            const base = new URL(baseUrl), events = [], text = clean(html), evidence = [];
            const jsonld = [];
            for (const m of html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)) {
              try { jsonld.push(...flattenJsonLd(JSON.parse(m[1].trim()))); } catch {}
            }

            const addEvent = (title, description, url, date, endDate, location, source) => {
              title = clean(title);
              description = clean(description).replace(/(?:^|\s)\.abf\{[\s\S]*$/i, ' ').replace(/\s+/g, ' ').trim();
              if (!title || title.length < 4 || title.length > 240) return;
              const combined = `${title} ${description} ${location} ${org.name}`;
              if (DANCE_RE.test(combined) || AMISH_RE.test(combined)) return;
              if (/^(?:events? from|skip to|home|search|today|upcoming|event views navigation|1251 bc|\d{3,4}\s*(?:bc|bce)\b)/i.test(title)) return;
              if (/\b(?:bc|bce)\b/i.test(title) || /\b(?:battle of arsuf|solar eclipse|earl godwine|king edward|antipope)\b/i.test(title)) return;
              const geo = geographicEvidence(combined, city, state);
              if (geo.score < 45) return;
              const distance = estimateDistance(`${city}, ${state}`, location);
              if (distance != null && distance > radius) return;
              events.push({
                id: key(title, abs(url || base.href, base) + '#' + (date || '')),
                title,
                description: description.slice(0, 1000),
                url: abs(url || base.href, base),
                date: date || '',
                endDate: endDate || '',
                location: location || `${city}, ${state}`,
                organizer: org.name,
                source,
                score: relevanceScore(combined, interests) + geo.score,
                type: 'event',
                discoveryQuality: 'verified',
                locationScore: geo.score,
                distanceMiles: distance,
                distance,
                org: org.name,
                host: org.name
              });
            };

            for (const x of jsonld) {
              const type = Array.isArray(x['@type']) ? x['@type'].join(' ') : String(x['@type'] || '');
              if (!/Event/i.test(type) || !x.name) continue;
              addEvent(
                x.name,
                x.description || '',
                x.url || base.href,
                x.startDate || '',
                x.endDate || '',
                formatLocation(x.location),
                'JSON-LD Event'
              );
            }
            if (events.length) evidence.push('JSON-LD Event');

            // Prefer heading-centered event cards. This avoids treating whole-page divs,
            // historical timelines, navigation, and footer content as events.
            const headingRe = /<h([1-6])[^>]*>([\s\S]*?)<\/h\1>([\s\S]{0,10000}?)(?=<h[1-6][^>]*>|$)/gi;
            for (const m of html.matchAll(headingRe)) {
              const title = clean(m[2]), block = clean(m[3]);
              const combined = `${title} ${block}`;
              const date = findDate(combined);
              if (!date || !EVENT_RE.test(combined) || DANCE_RE.test(combined) || AMISH_RE.test(combined)) continue;
              if (/\b(?:bc|bce)\b/i.test(combined) || /\b(?:solar eclipse|antipope|earl godwine|king edward|battle of arsuf)\b/i.test(combined)) continue;
              const geo = geographicEvidence(combined, city, state);
              if (geo.score < 45) continue;
              const location = extractLocation(combined, city, state);
              const distance = estimateDistance(`${city}, ${state}`, location);
              if (distance != null && distance > radius) continue;
              addEvent(title, block, base.href, date, '', location, 'validated event block');
            }
            if (events.length && !evidence.includes('HTML event block')) evidence.push('HTML event block');

            return events.length
              ? { events: dedupeEvents(events), evidence, rejectReason: null }
              : { events: [], evidence, rejectReason: !EVENT_RE.test(text) ? 'no event-specific evidence' : 'no validated local event' };
          }

          function dedupeEvents(items) {
            const seen = new Map();
            for (const item of items) {
              const k = `${eventTitleKey(item.title)}|${norm(item.date || '')}|${norm(item.location || '')}`;
              const old = seen.get(k);
              if (!old || (item.source === 'JSON-LD Event' && old.source !== 'JSON-LD Event')) seen.set(k, item);
            }
            return [...seen.values()];
          }

          function eventTitleKey(title) {
            return norm(title)
              .replace(/^(?:sun|mon|tue|wed|thu|fri|sat)\s+\d{1,2}\s+/i, '')
              .replace(/\bfeatured\b/g, '')
              .replace(/\b(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2}\b/gi, '')
              .replace(/\b20\d{2}\b/g, '')
              .replace(/\b(?:century village museum|auburn church)\b/g, '')
              .replace(/\s+/g, ' ')
              .trim();
          }
          '''

          job_fn = r'''function parseJobs(html, baseUrl, interests, city, state, radius = 30, options = {}) {
            const base = new URL(baseUrl), jobs = [], jsonld = [];
            const trusted = /neo-rls\.org/i.test(base.hostname) || /trusted job source/i.test(options.source || '');
            for (const m of html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)) {
              try { jsonld.push(...flattenJsonLd(JSON.parse(m[1].trim()))); } catch {}
            }

            const addJob = (title, block, url = base.href, data = {}) => {
              title = clean(title);
              block = clean(block);
              if (!looksLikeJobTitle(title) || !block) return;
              const combined = `${title} ${block}`;
              if (DANCE_RE.test(combined) || AMISH_RE.test(combined)) return;
              if (CAREER_RE.test(title) && !/(part[- ]?time|full[- ]?time|hours?|salary|wage|apply|position|job)/i.test(block)) return;
              const geo = geographicEvidence(combined, city, state);
              const distance = estimateDistance(`${city}, ${state}`, combined);
              const localByCity = !!cityKey(combined);
              if ((geo.score < 45 && !(trusted && localByCity)) || (distance != null && distance > radius)) return;
              if (options.partTime && !/(part[- ]?time|\b\d{1,2}\s*(?:-|to)\s*\d{1,2}\s*hours?\b|20\s*hours?|32\s*hours?|\bpart time\b|hourly)/i.test(combined)) return;
              const date = data.date || findDate(combined);
              jobs.push({
                id: key(title, url + '#' + date),
                title,
                organization: clean(data.organization || extractJobOrganization(combined)),
                url: abs(url, base),
                description: clean(data.description || block).slice(0, 1100),
                date,
                closeDate: data.closeDate || findCloseDate(combined),
                location: clean(data.location || extractJobLocation(combined, city, state)),
                employmentType: clean(data.employmentType || (/part[- ]?time/i.test(combined) ? 'Part-time' : /full[- ]?time/i.test(combined) ? 'Full-time' : '')),
                source: options.source || 'validated job block',
                score: relevanceScore(combined, interests) + geo.score,
                type: 'job',
                discoveryQuality: 'verified',
                locationScore: geo.score,
                distanceMiles: distance
              });
            };

            for (const x of jsonld) {
              const type = Array.isArray(x['@type']) ? x['@type'].join(' ') : String(x['@type'] || '');
              if (!/JobPosting/i.test(type) || !x.title) continue;
              const loc = formatLocation(x.jobLocation);
              const orgName = typeof x.hiringOrganization === 'object' ? x.hiringOrganization?.name || '' : x.hiringOrganization || '';
              addJob(x.title, `${x.description || ''} ${loc} ${orgName}`, x.url || base.href, {
                organization: orgName,
                description: x.description || '',
                location: loc,
                employmentType: x.employmentType || '',
                date: x.datePosted || '',
                closeDate: x.validThrough || ''
              });
            }

            const headingRe = /<h([1-6])[^>]*>([\s\S]*?)<\/h\1>([\s\S]{0,9000}?)(?=<h[1-6][^>]*>|$)/gi;
            for (const m of html.matchAll(headingRe)) addJob(clean(m[2]), m[3]);

            // NEO-RLS and similar boards can render listing titles as anchors rather than headings.
            // This fallback keys off the visible "Read More" listing boundary and then applies the
            // same locality, part-time, dance, and Amish validation as heading-derived jobs.
            const anchorRe = /<a[^>]+href=["']([^"']+)["'][^>]*>\s*([^<]{5,180})\s*<\/a>([\s\S]{0,7000}?)(?:Read More|(?=<a[^>]+href=["']))/gi;
            for (const m of html.matchAll(anchorRe)) {
              const title = clean(m[2]);
              if (!looksLikeJobTitle(title)) continue;
              addJob(title, m[3], abs(m[1], base));
            }

            return dedupeBy(jobs, x => key(x.title, x.url));
          }
          '''

          event_pattern = re.compile(r'function parseEvents\(.*?\n\}\n\nfunction relevanceScore', re.S)
          job_pattern = re.compile(r'function parseJobs\(.*?\n\}\nfunction looksLikeJobTitle', re.S)
          s2, n1 = event_pattern.subn(event_fn + '\nfunction relevanceScore', s, count=1)
          if n1 != 1:
              raise SystemExit(f'parseEvents replacement count={n1}')
          s3, n2 = job_pattern.subn(job_fn + '\nfunction looksLikeJobTitle', s2, count=1)
          if n2 != 1:
              raise SystemExit(f'parseJobs replacement count={n2}')
          p.write_text(s3)

      - name: Syntax check
        run: node --check worker/index.js

      - name: Parser smoke tests
        run: |
          node --input-type=module <<'NODE'
          import { parseEvents, parseJobs } from './worker/index.js';
          const eventHtml = `
            <html><body>
              <h3>Apple Butter Festival and Ox Roast 2026</h3>
              <p>October 10 2026 10:00 AM. Century Village Museum, Burton, OH. Festival and historic tours.</p>
              <h3>1251 BC Solar eclipse on this date</h3>
              <p>Ancient history conference in Greece.</p>
            </body></html>`;
          const ev = parseEvents(eventHtml, 'https://centuryvillagemuseum.org/events-calendar/', ['history'], 'Mesopotamia', 'OH', {name:'Century Village Museum', url:'https://centuryvillagemuseum.org/'}, 75);
          if (ev.events.length !== 1 || !/Apple Butter/i.test(ev.events[0].title)) throw new Error('event parser smoke test failed');

          const jobHtml = `
            <html><body>
              <h2>Delivery Driver (Part Time) - Warren-Trumbull County Public Library</h2>
              <p>The Warren-Trumbull County Public Library is seeking a dependable Delivery Driver. Part-time, 20 hours/week. Warren, OH.</p>
              <h2>Dance Instructor</h2>
              <p>Part-time dance position in Warren, OH.</p>
            </body></html>`;
          const jobs = parseJobs(jobHtml, 'https://www.neo-rls.org/view_job_postings.php', ['museum'], 'Mesopotamia', 'OH', 30, {source:'NEO-RLS', partTime:true});
          if (jobs.length !== 1 || !/Delivery Driver/i.test(jobs[0].title)) throw new Error('job parser smoke test failed');
          console.log('3.9.4 parser smoke tests passed');
          NODE

      - name: Commit repaired worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Phase 3.9.4 repair job and event parsers"
          git push origin main
