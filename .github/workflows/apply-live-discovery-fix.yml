name: Apply live discovery fix
on:
  push:
    branches:
      - fix/live-discovery-code-path
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate
        run: |
          git diff --check
          node --check worker/index.js
          grep -q 'v3.9.10-live-discovery-path' worker/index.js
          grep -q 'JOB_JUNK_HOST_RE' worker/index.js
          grep -q 'zillow\\.com' worker/index.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Apply live discovery fix"
          git push origin HEAD
