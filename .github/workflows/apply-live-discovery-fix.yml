name: Apply live discovery fix
on:
  push:
    branches: [fix/live-discovery-code-path]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply live discovery fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('worker/index.js')
          s = p.read_text()
          # Search-result filtering: reject low-value real-estate, reference, news and similar domains before validation fetches.
          if 'LOW_VALUE_HOST_RE' not in s:
              anchor = 'const JUNK_HOST_RE = /(?:facebook|instagram|linkedin|youtube|tiktok|pinterest|x\\.com|twitter|wikipedia|yelp|tripadvisor|google|googleusercontent|googleapis|classroom|drive|accounts|menards|usps|17track|fedex)\\./i;'
              addition = anchor + '\nconst LOW_VALUE_HOST_RE = /(?:britannica\\.com|worldhistory\\.org|merriam-webster\\.com|almanac\\.com|petmd\\.com|a-z-animals\\.com|newsbreak\\.com|ground\\.news|raynetoday\\.com|restaurantji\\.com|tvtv\\.us|weather\\.com|history\\.com|pacnyc\\.org|centurycommunities\\.com|centurymartialarts\\.com|centuryhouse\\.biz|zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com)$/i;'
              if anchor not in s: raise SystemExit('junk host anchor missing')
              s = s.replace(anchor, addition, 1)
          if 'LOW_VALUE_PATH_RE' not in s:
              anchor = 'const LOW_VALUE_HOST_RE = /(?:britannica\\.com|worldhistory\\.org|merriam-webster\\.com|almanac\\.com|petmd\\.com|a-z-animals\\.com|newsbreak\\.com|ground\\.news|raynetoday\\.com|restaurantji\\.com|tvtv\\.us|weather\\.com|history\\.com|pacnyc\\.org|centurycommunities\\.com|centurymartialarts\\.com|centuryhouse\\.biz|zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com)$/i;'
              addition = anchor + '\nconst LOW_VALUE_PATH_RE = /\\/(?:dictionary|article|articles|news|weather|recipes?|podcasts?|restaurant-reviews?)\\b/i;'
              if anchor not in s: raise SystemExit('low value host anchor missing')
              s = s.replace(anchor, addition, 1)
          old = '      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;'
          new = '      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;'
          if old not in s: raise SystemExit('searchWeb filter anchor missing')
          s = s.replace(old, new, 1)
          # Make public web job discovery broad-first. User interests supplement the broad pass instead of replacing it.
          old_func = re.compile(r'function buildJobQueries\(interests, city, state\) \{.*?\n\}', re.S)
          new_func = '''function buildJobQueries(interests, city, state) {
  const p = `"${city}" ${state}`;
  const broad = [
    "maintenance facilities technician laborer",
    "welding fabrication mechanic equipment",
    "warehouse material handling delivery transportation",
    "parks grounds recreation natural resources",
    "museum historic preservation library",
    "custodial facilities building maintenance"
  ];
  const specific = interests.slice(0, 2).map(x => clean(x)).filter(Boolean);
  const base = [...broad.slice(0, 4), ...specific, ...broad.slice(4)];
  return [...new Set(base.map(x => `"${x}" ${p} (jobs OR careers OR employment OR hiring) -dance`))].slice(0, 6);
}'''
          s2, n = old_func.subn(new_func, s, count=1)
          if n != 1: raise SystemExit(f'buildJobQueries function not found: {n}')
          s = s2
          # Reject clearly non-job candidate pages before spending the validation fetch.
          if 'JOB_JUNK_HOST_RE' not in s:
              anchor = 'const LOW_VALUE_PATH_RE = /\\/(?:dictionary|article|articles|news|weather|recipes?|podcasts?|restaurant-reviews?)\\b/i;'
              addition = anchor + '\nconst JOB_JUNK_HOST_RE = /(?:zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com|pinterest\\.com|wikipedia\\.org|newsbreak\\.com|merriam-webster\\.com)$/i;'
              if anchor not in s: raise SystemExit('path anchor missing')
              s = s.replace(anchor, addition, 1)
          old = '      if (!acceptDiscoveryUrl(u, state) || CAREER_RE.test(u)) continue;'
          new = '      if (!acceptDiscoveryUrl(u, state) || CAREER_RE.test(u) || JOB_JUNK_HOST_RE.test(host(u))) continue;'
          if old not in s: raise SystemExit('job candidate filter anchor missing')
          s = s.replace(old, new, 1)
          # Make the live build self-identifying in every discovery payload.
          old = 'const BUILD = "v3.9.9-discovery-efficiency";'
          new = 'const BUILD = "v3.9.10-live-discovery-path";'
          if old not in s: raise SystemExit('build anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          git diff --check
          node --check worker/index.js
          grep -q 'v3.9.10-live-discovery-path' worker/index.js
          grep -q 'LOW_VALUE_HOST_RE' worker/index.js
          grep -q 'LOW_VALUE_PATH_RE' worker/index.js
          grep -q 'JOB_JUNK_HOST_RE' worker/index.js
          grep -q 'const broad = \[' worker/index.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Apply live discovery fix"
          git push origin HEAD
          git rm .github/workflows/apply-live-discovery-fix.yml
          git commit -m "Remove temporary live discovery fix workflow"
          git push origin HEAD
