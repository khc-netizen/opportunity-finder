name: Apply live discovery fix
on:
  push:
    branches:
      - fix/live-discovery-code-path
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = '''function buildJobQueries(interests, city, state) {
            const p = `"${city}" ${state}`;
            const broad = ["maintenance facilities technician laborer", "welding fabrication mechanic equipment", "warehouse material handling delivery transportation", "parks grounds recreation natural resources", "museum historic preservation library", "custodial facilities building maintenance"];
            const specific = interests.slice(0, 4).map(x => clean(x)).filter(Boolean);
            const base = interests.length ? [...specific, ...broad.slice(0, 6 - specific.length)] : broad;
            return [...new Set(base.map(x => `"${x}" ${p} (jobs OR careers OR employment OR hiring) -dance`))].slice(0, 6);
          }'''
          new = '''function buildJobQueries(interests, city, state) {
            const p = `"${city}" ${state}`;
            const broad = [
              "maintenance facilities technician laborer",
              "welding fabrication mechanic equipment",
              "warehouse material handling delivery transportation",
              "parks grounds recreation natural resources",
              "museum historic preservation library",
              "custodial facilities building maintenance"
            ];
            const specific = interests.slice(0, 2).map(x => clean(x)).filter(Boolean);
            const base = [...broad.slice(0, 4), ...specific, ...broad.slice(4)];
            return [...new Set(base.map(x => `"${x}" ${p} (jobs OR careers OR employment OR hiring) -dance`))].slice(0, 6);
          }'''
          if old not in s: raise SystemExit('buildJobQueries block not found')
          s = s.replace(old, new, 1)
          old = 'const LOW_VALUE_HOST_RE = /(?:britannica\\.com|worldhistory\\.org|merriam-webster\\.com|almanac\\.com|petmd\\.com|a-z-animals\\.com|newsbreak\\.com|ground\\.news|raynetoday\\.com|restaurantji\\.com|tvtv\\.us|weather\\.com|history\\.com|pacnyc\\.org|centurycommunities\\.com|centurymartialarts\\.com|centuryhouse\\.biz)$/i;'
          new = 'const LOW_VALUE_HOST_RE = /(?:britannica\\.com|worldhistory\\.org|merriam-webster\\.com|almanac\\.com|petmd\\.com|a-z-animals\\.com|newsbreak\\.com|ground\\.news|raynetoday\\.com|restaurantji\\.com|tvtv\\.us|weather\\.com|history\\.com|pacnyc\\.org|centurycommunities\\.com|centurymartialarts\\.com|centuryhouse\\.biz|zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com)$/i;'
          if 'zillow\\.com' not in s:
              if old not in s: raise SystemExit('low-value host block not found')
              s = s.replace(old, new, 1)
          old = '      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;'
          new = '      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;'
          if 'LOW_VALUE_HOST_RE.test(x.hostname)' not in s:
              if old not in s: raise SystemExit('searchWeb filter block not found')
              s = s.replace(old, new, 1)
          old = 'const LOW_VALUE_PATH_RE = /\\/(?:dictionary|article|articles|news|weather|recipes?|podcasts?|restaurant-reviews?)\\b/i;'
          new = old + '\nconst JOB_JUNK_HOST_RE = /(?:zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com|pinterest\\.com|wikipedia\\.org|newsbreak\\.com|merriam-webster\\.com)$/i;'
          if 'JOB_JUNK_HOST_RE' not in s:
              if old not in s: raise SystemExit('low-value path block not found')
              s = s.replace(old, new, 1)
          old = '      if (!acceptDiscoveryUrl(u, state) || CAREER_RE.test(u)) continue;'
          new = '      if (!acceptDiscoveryUrl(u, state) || CAREER_RE.test(u) || JOB_JUNK_HOST_RE.test(host(u))) continue;'
          if old not in s: raise SystemExit('job filter block not found')
          s = s.replace(old, new, 1)
          old = 'const BUILD = "v3.9.9-discovery-efficiency";'
          new = 'const BUILD = "v3.9.10-live-discovery-path";'
          if old not in s: raise SystemExit('build marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          git diff --check
          node --check worker/index.js
          grep -q 'v3.9.10-live-discovery-path' worker/index.js
          grep -q 'JOB_JUNK_HOST_RE' worker/index.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Apply live discovery fix"
          git push --force-with-lease origin HEAD
