name: Apply live discovery fix
on:
  push:
    branches:
      - fix/live-discovery-code-path
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final search filter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = '      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;'
          new = '      if (JUNK_HOST_RE.test(x.hostname)) return;\n      if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return;\n      if (FOREIGN_GOV_HOST_RE.test(x.hostname)) return;'
          if old not in s: raise SystemExit('searchWeb filter block not found')
          s = s.replace(old, new, 1)
          old = 'const BUILD = "v3.9.10-live-discovery-path";'
          new = 'const BUILD = "v3.9.11-search-filter";'
          if old not in s: raise SystemExit('build marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          git diff --check
          node --check worker/index.js
          grep -q 'v3.9.11-search-filter' worker/index.js
          grep -q 'LOW_VALUE_HOST_RE.test(x.hostname)' worker/index.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Filter low-value discovery search results"
          git push --force-with-lease origin HEAD
