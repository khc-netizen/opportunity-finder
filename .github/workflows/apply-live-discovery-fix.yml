name: Apply live discovery fix
on:
  push:
    branches: [fix/live-discovery-code-path]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('worker/index.js')
          s = p.read_text()
          def once(pattern, replacement, label):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected one {label}, got {n}')
              s = s2
          if 'zillow\\.com' not in s:
              once(r'(const JUNK_HOST_RE = .*?;)', r'\1\nconst LOW_VALUE_HOST_RE = /(?:britannica\\.com|worldhistory\\.org|merriam-webster\\.com|almanac\\.com|petmd\\.com|a-z-animals\\.com|newsbreak\\.com|ground\\.news|raynetoday\\.com|restaurantji\\.com|tvtv\\.us|weather\\.com|history\\.com|pacnyc\\.org|centurycommunities\\.com|centurymartialarts\\.com|centuryhouse\\.biz|zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com)$/i;', 'low-value host filter')
          if 'LOW_VALUE_PATH_RE' not in s:
              once(r'(const LOW_VALUE_HOST_RE = .*?;)', r'\1\nconst LOW_VALUE_PATH_RE = /\\/(?:dictionary|article|articles|news|weather|recipes?|podcasts?|restaurant-reviews?)\\b/i;', 'low-value path filter')
          if 'LOW_VALUE_HOST_RE.test(x.hostname)' not in s:
              once(r'(if \(JUNK_HOST_RE\.test\(x\.hostname\)\) return;\n)(\s*if \(FOREIGN_GOV_HOST_RE\.test\(x\.hostname\)\) return;)', r'\1      if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return;\n\2', 'searchWeb filtering')
          once(r'function buildJobQueries\(interests, city, state\) \{.*?\n\}', '''function buildJobQueries(interests, city, state) {
  const p = `"${city}" ${state}`;
  const broad = [
    "maintenance facilities technician laborer",
    "welding fabrication mechanic equipment",
    "warehouse material handling delivery transportation",
    "parks grounds recreation natural resources",
    "museum historic preservation library",
    "custodial facilities building maintenance"
  ];
  const specific = interests.slice(0, 2).map(x => clean(x)).filter(Boolean);
  const base = [...broad.slice(0, 4), ...specific, ...broad.slice(4)];
  return [...new Set(base.map(x => `"${x}" ${p} (jobs OR careers OR employment OR hiring) -dance`))].slice(0, 6);
}''', 'buildJobQueries')
          if 'JOB_JUNK_HOST_RE' not in s:
              once(r'(const LOW_VALUE_PATH_RE = .*?;)', r'\1\nconst JOB_JUNK_HOST_RE = /(?:zillow\\.com|realtor\\.com|redfin\\.com|trulia\\.com|pinterest\\.com|wikipedia\\.org|newsbreak\\.com|merriam-webster\\.com)$/i;', 'job junk host filter')
          once(r'if \(!acceptDiscoveryUrl\(u, state\) \|\| CAREER_RE\.test\(u\)\) continue;', r'if (!acceptDiscoveryUrl(u, state) || CAREER_RE.test(u) || JOB_JUNK_HOST_RE.test(host(u))) continue;', 'job candidate filter')
          once(r'const BUILD = "v3\.9\.9-discovery-efficiency";', r'const BUILD = "v3.9.10-live-discovery-path";', 'build marker')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          git diff --check
          node --check worker/index.js
          grep -q 'v3.9.10-live-discovery-path' worker/index.js
          grep -q 'zillow\\.com' worker/index.js
          grep -q 'LOW_VALUE_PATH_RE' worker/index.js
          grep -q 'JOB_JUNK_HOST_RE' worker/index.js
          grep -q 'function buildJobQueries' worker/index.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Apply live discovery fix"
          git push origin HEAD
          git rm .github/workflows/apply-live-discovery-fix.yml LIVE_DISCOVERY_FIX_TRIGGER.txt
          git commit -m "Remove temporary live discovery fix workflow"
          git push origin HEAD
