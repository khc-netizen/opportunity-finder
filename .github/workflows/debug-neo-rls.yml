name: Debug NEO-RLS parser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-neo-rls.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch NEO-RLS geographic acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = 'if (geo.score < 45 || (distance != null && distance > radius)) continue;'
          new = 'if ((geo.score < 45 && distance == null) || (distance != null && distance > radius)) continue;'
          if old not in s:
              raise SystemExit('target geographic acceptance condition not found')
          s = s.replace(old, new, 1)
          s = s.replace('const VERSION = "3.9.5";', 'const VERSION = "3.9.6";', 1)
          s = s.replace('const BUILD = "v3.9.5-source-specific-job-event-repair";', 'const BUILD = "v3.9.6-neo-rls-geographic-acceptance";', 1)
          p.write_text(s)
          PY
          node --check worker/index.js
      - name: Test parser against live NEO-RLS
        run: |
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs } from './worker/index.js';
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          console.log('HTTP', r.status, 'HTML bytes', html.length);
          const jobs = parseNeoRlsJobs(html, 'https://www.neo-rls.org/view_job_postings.php', ['museum','artifact conservation','historic preservation','archaeology','bike mechanic','welding','fabrication','woodworking','artisan','crafts'], 'Mesopotamia', 'OH', 30, {source:'NEO-RLS',partTime:true});
          console.log('PARSED JOB COUNT', jobs.length);
          for (const j of jobs) console.log(JSON.stringify(j));
          if (jobs.length === 0) throw new Error('Live NEO-RLS parser still returned zero jobs');
          JS
      - name: Commit worker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.6 fix NEO-RLS geographic validation" || exit 0
          git push origin main
