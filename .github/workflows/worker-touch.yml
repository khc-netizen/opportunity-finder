name: Touch worker for deployment

on:
  push:
    branches: [cloudflare-worker-touch]

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch worker source
        shell: bash
        run: |
          if [ ! -f .github/worker-touch.flag ]; then
            echo "No touch flag; nothing to do."
            exit 0
          fi
          printf '\n// Cloudflare deployment verification touch — validated 3.9.3 worker.\n' >> worker/index.js
          rm -f .github/worker-touch.flag
          node --check worker/index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js .github/worker-touch.flag
          git commit -m "chore: touch validated worker source for deployment"
          git push
