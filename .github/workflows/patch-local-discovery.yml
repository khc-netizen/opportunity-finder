name: Patch local discovery
on:
  push:
    branches:
      - fix/local-discovery-noise
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-discovery-noise
          fetch-depth: 0
      - name: Apply targeted patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          replacements = [
          ('''const JUNK_HOST_RE = /(?:facebook|instagram|linkedin|youtube|tiktok|pinterest|x\\.com|twitter|wikipedia|yelp|tripadvisor)\\./i;''', '''const JUNK_HOST_RE = /(?:facebook|instagram|linkedin|youtube|tiktok|pinterest|x\\.com|twitter|wikipedia|yelp|tripadvisor|google|googleusercontent|googleapis|classroom|drive|accounts|menards|usps|17track|fedex)\\./i;'''),
          ('''function targetPlaces(city, state) {\n  if (/^(OH|Ohio)$/i.test(state)) return [\n    `"${city}" Ohio`, `"Trumbull County" Ohio`, `"Warren" Ohio`, `"Northeast Ohio"`, `"Geauga County" Ohio`, `"Portage County" Ohio`, `"Ashtabula County" Ohio`, `"Mahoning County" Ohio`\n  ];\n  return [`"${city}" "${state}"`, `"${state}"`];\n}''', '''function targetPlaces(city, state) {\n  if (/^(OH|Ohio)$/i.test(state)) return [\n    `"${city}" "Trumbull County" Ohio`, `"Trumbull County" Ohio`, `"Warren" "Trumbull County" Ohio`, `"Northeast Ohio"`, `"Geauga County" Ohio`, `"Portage County" Ohio`, `"Ashtabula County" Ohio`, `"Mahoning County" Ohio`\n  ];\n  return [`"${city}" "${state}"`, `"${state}"`];\n}\nfunction localSearchSuffix(state) {\n  return /^(OH|Ohio)$/i.test(state) ? ` -dance -"ancient Mesopotamia" -"Mesopotamia historical region" -Louisiana -"Church Point"` : "";\n}'''),
          ('''    qs.push(`"${cats[i]}" ${p} Ohio (association OR society OR club OR guild OR chapter OR organization) -dance`);\n    if (i < 5) qs.push(`${p} ("historical society" OR museum OR "nature center" OR beekeepers OR blacksmith OR reenactment OR "craft guild") -dance`);''', '''    const suffix = localSearchSuffix(state);\n    qs.push(`"${cats[i]}" ${p} Ohio (association OR society OR club OR guild OR chapter OR organization)${suffix}`);\n    if (i < 5) qs.push(`${p} ("historical society" OR museum OR "nature center" OR beekeepers OR blacksmith OR reenactment OR "craft guild")${suffix}`);'''),
          ('''    qs.push(`${p} "${cats[i]}" (museum OR library OR "historic site" OR "nature center" OR fairgrounds OR observatory OR "community center") -dance`);''', '''    qs.push(`${p} "${cats[i]}" (museum OR library OR "historic site" OR "nature center" OR fairgrounds OR observatory OR "community center")${localSearchSuffix(state)}`);'''),
          ('''  const orgCandidates = [...BUILTIN_DISCOVERY_SEEDS, ...listEnv(env, "GROUP_SEEDS"), ...listEnv(env, "DISCOVERY_SEEDS")]\n    .filter(u => acceptDiscoveryUrl(u, state))\n    .map(u => ({ url: u, query: "trusted discovery seed" }));''', '''  const orgCandidates = [...BUILTIN_DISCOVERY_SEEDS, ...listEnv(env, "GROUP_SEEDS"), ...listEnv(env, "DISCOVERY_SEEDS")]\n    .filter(u => acceptDiscoveryUrl(u, state))\n    .map(u => ({ url: u, query: "trusted discovery seed", trusted: true }));'''),
          ('''    const page = parseOrganizationPage(r.text, c.url, interests, city, state, false, radius);\n    d.evidence = page.evidence; d.accepted = page.organizations.length; d.rejected = page.organizations.length ? null : page.rejectReason;\n    diagnostics.push(d); organizations.push(...page.organizations);''', '''    const page = parseOrganizationPage(r.text, c.url, interests, city, state, false, radius);\n    d.evidence = page.evidence; d.accepted = page.organizations.length; d.rejected = page.organizations.length ? null : page.rejectReason;\n    if (!page.organizations.length && c.trusted) {\n      const trustedName = trustedSeedName(c.url);\n      organizations.push({\n        id: key(trustedName, c.url), name: trustedName, url: c.url, description: "Verified local discovery seed.",\n        type: classifyOrg(trustedName), confidence: 95, score: 95, location: `${city}, ${state}`,\n        source: "trusted discovery seed", discoveryQuality: "verified", locationScore: 65, distanceMiles: null\n      });\n      d.accepted = 1; d.rejected = null; d.evidence = [...d.evidence, "trusted-seed-fallback"];\n    }\n    diagnostics.push(d); organizations.push(...page.organizations);'''),
          ('''function acceptDiscoveryUrl(u, state) {''', '''function trustedSeedName(url) {\n  const h = String(url || "").toLowerCase();\n  if (h.includes("trumbullbeekeepers.org")) return "Trumbull Beekeepers";\n  if (h.includes("wraba.com")) return "Western Reserve Artist Blacksmith Association";\n  if (h.includes("centuryvillagemuseum.org")) return "Century Village Museum";\n  if (h.includes("trumbullcountyhistory.com")) return "Trumbull County Historical Society";\n  if (h.includes("trumbullcountyhistory.org/trumbull-history-hub")) return "Trumbull History Hub";\n  try { return humanizeHostname(new URL(url).hostname).replace(/\\b\\w/g, c => c.toUpperCase()); } catch { return "Trusted local organization"; }\n}\nfunction acceptDiscoveryUrl(u, state) {'''),
          ('''  const eventBudget = { used: 0, limit: Math.min(24, Math.max(0, budget.limit - budget.used)) };''', '''  // Cloudflare's subrequest ceiling is lower than the configurable fetch budget.\n  // Organization/venue discovery can consume up to 36 calls, so keep event discovery\n  // capped at 14 to stay below the 50-subrequest ceiling.\n  const eventBudget = { used: 0, limit: Math.min(14, Math.max(0, budget.limit - budget.used)) };'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected source text not found for replacement:\n' + old[:180])
              if s.count(old) != 1:
                  raise SystemExit('Replacement is not unique: ' + old[:100])
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          node --check worker/index.js
          git diff --stat
          git diff -- worker/index.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "fix: tighten local discovery and event fetch budget"
          git push origin fix/local-discovery-noise
