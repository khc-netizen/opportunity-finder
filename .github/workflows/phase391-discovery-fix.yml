name: Phase 3.9.1 discovery pipeline fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch discovery pipeline
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          marker = 'PHASE_3_9_1_DISCOVERY_PIPELINE'
          if marker in s:
              print('Phase 3.9.1 patch already present; nothing to do.')
              raise SystemExit(0)

          s = s.replace(
              'const BUILD = "v3.9.0-clean-local-validation";',
              'const BUILD = "v3.9.1-discovery-pipeline";'
          )

          anchor = '''const BUILTIN_DISCOVERY_SEEDS = [\n  "https://www.trumbullbeekeepers.org/",\n  "https://www.wraba.com/",\n  "https://centuryvillagemuseum.org/",\n  "https://www.trumbullcountyhistory.com/",\n  "https://sites.google.com/trumbullcountyhistory.org/trumbull-history-hub/home/mesopotamia"\n];'''
          addition = anchor + '''\n\n// PHASE_3_9_1_DISCOVERY_PIPELINE\n// Trusted regional organizations are anchors, not synthetic events. Their live pages are\n// still fetched for current activity, while the organizations themselves remain discoverable\n// even when a small site is slow, script-heavy, or temporarily returns sparse HTML.\nconst BUILTIN_TRUSTED_ORGS = [\n  { name: "Trumbull Beekeepers Association", url: "https://www.trumbullbeekeepers.org/", description: "Local beekeeping association serving Trumbull County and surrounding Northeast Ohio.", type: "beekeeping", location: "Cortland, OH 44410", score: 100, confidence: 100, locationScore: 100, discoveryQuality: "verified" },\n  { name: "Western Reserve Artist Blacksmith Association", url: "https://www.wraba.com/", description: "Regional nonprofit organization dedicated to preserving and demonstrating the art of blacksmithing.", type: "blacksmithing", location: "Burton, OH 44021", score: 100, confidence: 100, locationScore: 100, discoveryQuality: "verified" },\n  { name: "Century Village Museum", url: "https://centuryvillagemuseum.org/", description: "Historical educational center and living-history museum in Burton, Ohio.", type: "museum / history", location: "Burton, OH 44021", score: 100, confidence: 100, locationScore: 100, discoveryQuality: "verified" },\n  { name: "Trumbull County Historical Society", url: "https://www.trumbullcountyhistory.com/", description: "Trumbull County historical society, museum, collections, research, and public programs.", type: "museum / history", location: "Warren, OH 44483", score: 100, confidence: 100, locationScore: 100, discoveryQuality: "verified" },\n  { name: "Mesopotamia Memorial and Historical Association", url: "https://sites.google.com/trumbullcountyhistory.org/trumbull-history-hub/home/mesopotamia", description: "Local historical association and museum in Mesopotamia, Ohio.", type: "museum / history", location: "Mesopotamia, OH 44430", score: 100, confidence: 100, locationScore: 100, discoveryQuality: "verified" }\n];\n\n// Current public event/calendar pages for trusted anchors. These are source pages, not\n// hard-coded event records; parseEvents still decides what is a valid current event.\nconst BUILTIN_EVENT_SEEDS = [\n  { url: "https://centuryvillagemuseum.org/events-calendar/", org: "Century Village Museum" },\n  { url: "https://www.trumbullcountyhistory.com/", org: "Trumbull County Historical Society" },\n  { url: "https://www.wraba.com/", org: "Western Reserve Artist Blacksmith Association" },\n  { url: "https://www.trumbullbeekeepers.org/", org: "Trumbull Beekeepers Association" }\n];'''
          if anchor not in s:
              raise SystemExit('Anchor block not found; aborting without changes.')
          s = s.replace(anchor, addition, 1)

          old_orgs = 'const orgs = dedupeOrganizations(organizations).slice(0, 100);'
          new_orgs = '''const orgs = dedupeOrganizations([...organizations, ...BUILTIN_TRUSTED_ORGS]).slice(0, 100);'''
          if old_orgs not in s:
              raise SystemExit('Organization assembly block not found; aborting without changes.')
          s = s.replace(old_orgs, new_orgs, 1)

          old_budget = 'const eventBudget = { used: 0, limit: Math.min(18, Math.max(0, budget.limit - budget.used)) };'
          new_budget = 'const eventBudget = { used: 0, limit: Math.min(28, Math.max(0, budget.limit - budget.used)) };'
          if old_budget not in s:
              raise SystemExit('Event budget block not found; aborting without changes.')
          s = s.replace(old_budget, new_budget, 1)

          needle = '  const events = [];\n  for (const org of anchors.slice(0, 8)) {'
          replacement = '''  const events = [];\n\n  // First fetch known current calendar pages directly. This avoids depending on a\n  // search engine indexing a small local organization's events page.\n  for (const seed of BUILTIN_EVENT_SEEDS) {\n    if (eventBudget.used >= eventBudget.limit) break;\n    const org = anchors.find(x => x.name === seed.org) || BUILTIN_TRUSTED_ORGS.find(x => x.name === seed.org);\n    if (!org) continue;\n    const pr = await fetchText(seed.url, {}, eventBudget);\n    const d = { stage: "trusted-event-source", organization: org.name, url: seed.url, ok: pr.ok, status: pr.status, accepted: 0, rejected: null };\n    if (!pr.ok) { d.rejected = pr.error || `HTTP ${pr.status}`; diagnostics.push(d); continue; }\n    const found = parseEvents(pr.text, seed.url, interests, city, state, org, radius);\n    d.accepted = found.events.length;\n    d.rejected = found.events.length ? null : found.rejectReason;\n    diagnostics.push(d);\n    events.push(...found.events);\n  }\n\n  for (const org of anchors.slice(0, 8)) {'''
          if needle not in s:
              raise SystemExit('Event loop block not found; aborting without changes.')
          s = s.replace(needle, replacement, 1)

          # Add a lightweight local job-list parser after the strict JSON-LD parser. It only\n          # accepts blocks that look like an actual job posting, contain an Ohio target location,\n          # and match at least one requested interest. Career landing pages remain rejected.\n          job_marker = '  // A career link by itself is intentionally NOT accepted as a job. This is the key 3.8 change.\n  return dedupeBy(jobs, x => key(x.title, x.url));\n}'
          job_replacement = '''  // A career link by itself is intentionally NOT accepted as a job. This is the key 3.8 change.\n  // 3.9.1 also recognizes real job-listing blocks on regional public job boards whose pages\n  // do not publish JSON-LD JobPosting. It does not accept a generic careers page.\n  for (const m of html.matchAll(/<(article|li|section|div)[^>]*>([\\s\\S]*?)<\\/\\1>/gi)) {\n    const block = clean(m[2]);\n    if (block.length < 80 || block.length > 5000) continue;\n    if (!/\\b(?:part[ -]?time|full[ -]?time|hours? per week|salary|hourly|apply|position|job)\\b/i.test(block)) continue;\n    const geo = geographicEvidence(block, city, state);\n    if (geo.score < 45) continue;\n    if (DANCE_RE.test(block)) continue;\n    const wanted = interests.some(i => { const q = norm(i); return q && block.toLowerCase().includes(q.toLowerCase()); }) || /\\b(?:museum|library|maintenance|maker|fabricat|weld|woodwork|mechanic|historic|archaeol|craft|preservation|parks?)\\w*/i.test(block);\n    if (!wanted) continue;\n    const titleMatch = block.match(/(?:^|[.!?]\\s)([^.]{5,120}?(?:worker|assistant|associate|mechanic|welder|fabricator|technician|manager|specialist|coordinator|librarian|museum|maintenance|maker|craft)[^.]{0,80})/i);\n    const title = clean(titleMatch ? titleMatch[1] : block.slice(0, 120));\n    if (title.length < 5) continue;\n    const distance = estimateDistance(`${city}, ${state}`, block);\n    if (distance != null && distance > radius) continue;\n    jobs.push({ id: key(title, base.href + '#' + title), title, organization: '', url: base.href, description: block.slice(0, 1100), date: '', closeDate: '', location: extractLocation(block, city, state), employmentType: /part[ -]?time/i.test(block) ? 'Part-time' : '', source: 'validated public job listing', score: relevanceScore(block, interests) + geo.score, type: 'job', discoveryQuality: 'validated-lead', locationScore: geo.score, distanceMiles: distance });\n  }\n  return dedupeBy(jobs, x => key(x.title, x.url));\n}'''
          if job_marker not in s:
              raise SystemExit('Job parser marker not found; aborting without changes.')
          s = s.replace(job_marker, job_replacement, 1)

          p.write_text(s)
          PY

      - name: Validate Worker syntax
        run: node --check worker/index.js

      - name: Commit Phase 3.9.1 patch
        run: |
          git config user.name "Opportunity Finder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker/index.js
          if git diff --cached --quiet; then
            echo "No worker changes to commit."
            exit 0
          fi
          git commit -m "Phase 3.9.1: strengthen local discovery and event/job extraction"
          git push
