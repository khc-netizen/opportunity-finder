name: Discovery Quality Pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted candidate prefiltering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          marker = 'const DISCOVERY_QUALITY_PASS = "2026-09-10";'
          if marker in s:
              print('Quality pass already applied.')
              raise SystemExit(0)
          old = '''function acceptDiscoveryUrl(u, state) {
  if (!isHttp(u)) return false;
  try {
    const x = new URL(u);
    if (JUNK_HOST_RE.test(x.hostname)) return false;
    if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return false;
    if (isObviousOutOfState(x.href, state)) return false;
    return true;
  } catch { return false; }
}'''
          new = '''const DISCOVERY_QUALITY_PASS = "2026-09-10";
const GENERIC_CONTENT_PATH_RE = /\\/(?:story|stories|press|press-release|opinion|opinions|blog|blogs|podcast|podcasts|dictionary|definition|definitions|encyclopedia|faq|how-to|howto)(?:\\/|$)/i;
const SEARCH_NOISE_RE = /\\b(?:ancient mesopotamia|mesopotamia river|mesopotamian|louisiana|church point)\\b/i;
function acceptDiscoveryUrl(u, state) {
  if (!isHttp(u)) return false;
  try {
    const x = new URL(u);
    if (JUNK_HOST_RE.test(x.hostname)) return false;
    if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return false;
    if (GENERIC_CONTENT_PATH_RE.test(x.pathname)) return false;
    if (isObviousOutOfState(x.href, state)) return false;
    return true;
  } catch { return false; }
}
function worthwhileDiscoveryCandidate(c, state, mode = "organization") {
  if (!c || !acceptDiscoveryUrl(c.url, state)) return false;
  const u = norm(c.url), q = norm(c.query || "");
  if (SEARCH_NOISE_RE.test(`${u} ${q}`)) return false;
  if (mode === "organization") return c.trusted || DISCOVERY_SIGNAL_RE.test(`${u} ${q}`);
  if (mode === "venue") return VENUE_RE.test(`${u} ${q}`) || DISCOVERY_SIGNAL_RE.test(`${u} ${q}`);
  if (mode === "event") return EVENT_RE.test(`${u} ${q}`) || DISCOVERY_SIGNAL_RE.test(`${u} ${q}`);
  return true;
}'''
          if old not in s: raise SystemExit('acceptDiscoveryUrl block not found')
          s = s.replace(old, new, 1)
          old = '  const uniqueOrgUrls = prioritizeCandidateUrls(orgCandidates).slice(0, ORG_VALIDATION_LIMIT);'
          new = '''  const uniqueOrgUrls = prioritizeCandidateUrls(orgCandidates)
    .filter(c => worthwhileDiscoveryCandidate(c, state, "organization"))
    .slice(0, ORG_VALIDATION_LIMIT);'''
          if old not in s: raise SystemExit('org candidate line not found')
          s = s.replace(old, new, 1)
          old = '''    for (const u of r.urls) if (acceptDiscoveryUrl(u, state)) venueCandidates.push({ url: u, query });'''
          new = '''    for (const u of r.urls) {
      const candidate = { url: u, query };
      if (worthwhileDiscoveryCandidate(candidate, state, "venue")) venueCandidates.push(candidate);
    }'''
          if old not in s: raise SystemExit('venue candidate line not found')
          s = s.replace(old, new, 1)
          old = '  for (const c of prioritizeCandidateUrls(venueCandidates).slice(0, VENUE_VALIDATION_LIMIT)) {'
          new = '''  for (const c of prioritizeCandidateUrls(venueCandidates)
    .filter(c => worthwhileDiscoveryCandidate(c, state, "venue"))
    .slice(0, VENUE_VALIDATION_LIMIT)) {'''
          if old not in s: raise SystemExit('venue validation line not found')
          s = s.replace(old, new, 1)
          old = '''      for (const u of r.urls.slice(0, 4)) {
        if (!acceptDiscoveryUrl(u, state) || (!EVENT_RE.test(norm(u)) && !DISCOVERY_SIGNAL_RE.test(norm(u)) && !sameHost(u, org.url)) || JOB_JUNK_HOST_RE.test(host(u)) || eventBudget.used >= eventBudget.limit) continue;'''
          new = '''      for (const u of r.urls.slice(0, 4)) {
        const candidate = { url: u, query };
        if (!worthwhileDiscoveryCandidate(candidate, state, "event") || (!EVENT_RE.test(norm(u)) && !DISCOVERY_SIGNAL_RE.test(norm(u)) && !sameHost(u, org.url)) || JOB_JUNK_HOST_RE.test(host(u)) || eventBudget.used >= eventBudget.limit) continue;'''
          if old not in s: raise SystemExit('event candidate block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Targeted discovery quality pass applied.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve discovery candidate quality"
          git push