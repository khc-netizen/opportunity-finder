name: Opportunity Finder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Worker syntax
        run: node --check worker/index.js
      - name: Validate coverage layer syntax
        run: node --check worker/coverage.js
      - name: Validate diagnostic local anchors syntax
        run: node --check worker/discovery-anchors.js
      - name: Validate active discovery engine syntax
        run: node --check worker/discovery-v2.js && node --check worker/exclusions.js
      - name: Validate legacy discovery syntax
        run: node --check worker/discovery.js
      - name: Validate legacy organic discovery syntax
        run: node --check worker/organic.js
      - name: Validate legacy job discovery syntax
        run: node --check worker/job-discovery.js
      - name: Validate ZIP geography syntax
        run: node --check worker/zip-geo.js
      - name: Validate frontend syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", s, flags=re.I)
          if not scripts:
              raise SystemExit("No inline script found in public/index.html")
          Path("/tmp/frontend-check.js").write_text("\n\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/frontend-check.js
      - name: Validate independent radius UI
        run: |
          grep -q 'id="groupRadius"' public/index.html
          grep -q 'id="eventRadius"' public/index.html
          grep -q 'id="jobRadius"' public/index.html
      - name: Validate configurable exclusions
        shell: bash
        run: |
          grep -q 'id="excludeGlobal"' public/index.html
          grep -q 'id="excludeGroups"' public/index.html
          grep -q 'id="excludeEvents"' public/index.html
          grep -q 'id="excludeJobs"' public/index.html
          grep -q 'configurable-exclusions' worker/coverage.js
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('worker/discovery-v2.js', 'utf8');
          if (!s.includes('parseExclusions') || !s.includes('isExcluded') || !s.includes('exclusionQuery')) {
            throw new Error('Active discovery-v2 exclusion hooks are missing');
          }
          NODE
      - name: Validate diagnostic local event fixtures
        run: |
          grep -q 'wraba.com/see_what_we_do/century_village_demos' worker/discovery-anchors.js
          grep -q 'centuryvillagemuseum.org/events-calendar' worker/discovery-anchors.js
          grep -q 'trumbullbeekeepers.org' worker/discovery-anchors.js
          grep -q 'tcba-official-recurring' worker/discovery-anchors.js
          grep -q 'diagnoseKnownLocalSources' worker/coverage.js
          grep -q 'diagnosticLocalAnchors' worker/coverage.js
          if grep -q 'augmentKnownLocalSources' worker/coverage.js; then
            echo 'Production coverage must not inject diagnostic anchors'
            exit 1
          fi
      - name: Verify required legacy architecture markers
        run: |
          grep -q 'architecture: "organization-first"' worker/index.js
          grep -q 'const DANCE_RE' worker/index.js
          grep -q 'const AMISH_RE' worker/index.js
          test ! -d .github/workflows/recovery
      - name: Run architecture regression checks
        run: node tests/architecture-check.mjs
      - name: Run discovery coverage checks
        run: node tests/coverage-check.mjs
      - name: Run verified ZIP geography checks
        run: node tests/zip-geo-check.mjs
      - name: Run independent ZIP radius checks
        run: node tests/independent-radius-check.mjs
