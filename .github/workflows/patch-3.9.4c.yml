name: Phase 3.9.5 source-specific parser repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-3.9.4c.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()

          s = s.replace('const VERSION = "3.9.4";', 'const VERSION = "3.9.5";', 1)
          s = s.replace('const BUILD = "v3.9.4-targeted-job-event-repair";', 'const BUILD = "v3.9.5-source-specific-job-event-repair";', 1)

          old = 'function clean(s) { return stripHtml(String(s || "")).replace(/\\s+/g, " ").trim(); }'
          new = '''function decodeEntities(s) {
            return String(s || "").replace(/&nbsp;|&#160;/gi, " ")
              .replace(/&amp;|&#38;|&#038;/gi, "&")
              .replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
              .replace(/&quot;/gi, '"').replace(/&apos;|&#39;|&#x27;/gi, "'")
              .replace(/&#x2f;|&#47;/gi, "/")
              .replace(/&#(\\d+);/g, (_, n) => { const c = Number(n); return c >= 0 && c <= 0x10ffff ? String.fromCodePoint(c) : _; })
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => { const c = parseInt(n, 16); return c >= 0 && c <= 0x10ffff ? String.fromCodePoint(c) : _; });
          }
          function clean(s) { return stripHtml(decodeEntities(String(s || ""))).replace(/\\s+/g, " ").trim(); }'''
          if old not in s: raise SystemExit('clean target missing')
          s = s.replace(old, new, 1)

          old = 'const found = parseJobs(r.text, source, interests, city, state, radius, { source: source.includes("neo-rls.org") ? "NEO-RLS" : "trusted job source", partTime });'
          new = 'const found = /neo-rls\\.org/i.test(source) ? parseNeoRlsJobs(r.text, source, interests, city, state, radius, { source: "NEO-RLS", partTime }) : parseJobs(r.text, source, interests, city, state, radius, { source: "trusted job source", partTime });'
          if old not in s: raise SystemExit('trusted job call target missing')
          s = s.replace(old, new, 1)

          marker = 'function parseJobs(html, baseUrl, interests, city, state, radius = 30, options = {}) {'
          if marker not in s: raise SystemExit('parseJobs marker missing')
          helper = '''function parseNeoRlsJobs(html, baseUrl, interests, city, state, radius = 30, options = {}) {
            const base = new URL(baseUrl), jobs = [];
            for (const m of html.matchAll(/<h2[^>]*>([\\s\\S]*?)<\\/h2>([\\s\\S]{0,12000}?)(?=<h2[^>]*>|$)/gi)) {
              const title = clean(m[1]), block = clean(m[2]);
              if (!looksLikeJobTitle(title) || !block) continue;
              const combined = `${title} ${block}`;
              if (DANCE_RE.test(combined) || AMISH_RE.test(combined)) continue;
              if (/^(?:view job postings|job seekers|category|keyword|jobline|home)$/i.test(title)) continue;
              if (options.partTime && !/(part[- ]?time|\\b\\d{1,2}\\s*(?:-|to)\\s*\\d{1,2}\\s*hours?\\b|\\b(?:15|16|18|20|24|25|30|32)\\s*hours?\\b|hourly)/i.test(combined)) continue;
              const geo = geographicEvidence(combined, city, state);
              const distance = estimateDistance(`${city}, ${state}`, combined);
              if (geo.score < 45 || (distance != null && distance > radius)) continue;
              const link = (m[2].match(/<a[^>]+href=["']([^"']+)["'][^>]*>\\s*Read More/i) || [])[1];
              const url = abs(link || base.href, base);
              jobs.push({
                id: key(title, url),
                title,
                organization: extractJobOrganization(combined),
                url,
                description: block.slice(0, 1100),
                date: findDate(combined),
                closeDate: findCloseDate(combined),
                location: extractJobLocation(combined, city, state),
                employmentType: /part[- ]?time/i.test(combined) ? "Part-time" : /full[- ]?time/i.test(combined) ? "Full-time" : "",
                source: "NEO-RLS",
                score: relevanceScore(combined, interests) + geo.score,
                type: "job",
                discoveryQuality: "verified",
                locationScore: geo.score,
                distanceMiles: distance
              });
            }
            return dedupeBy(jobs, x => key(x.title, x.url));
          }
          '''
          s = s.replace(marker, helper + marker, 1)

          old = 'const geo = geographicEvidence(combined + " " + text.slice(0, 8000), city, state);'
          new = 'const geo = geographicEvidence(combined, city, state);'
          if old not in s: raise SystemExit('event geo target missing')
          s = s.replace(old, new, 1)

          old = 'if (events.length) evidence.push("JSON-LD Event");\n\n  for (const m of html.matchAll(/<(article|li|div|section)[^>]*>([\\s\\S]*?)<\\/\\1>/gi)) {'
          new = 'if (events.length) { evidence.push("JSON-LD Event"); return { events: dedupeEvents(events), evidence, rejectReason: null }; }\n\n  for (const m of html.matchAll(/<(article|li|div|section)[^>]*>([\\s\\S]*?)<\\/\\1>/gi)) {'
          if old not in s: raise SystemExit('event JSON-LD gate target missing')
          s = s.replace(old, new, 1)

          old = 'const k = `${eventTitleKey(item.title)}|${norm(item.date || "")}|${norm(item.location || "")}`;'
          new = 'const k = `${eventTitleKey(item.title)}|${norm(item.location || "")}`;'
          if old not in s: raise SystemExit('event dedupe target missing')
          s = s.replace(old, new, 1)

          old = 'const h = clean((m[1].match(/<h[1-4][^>]*>([\\s\\S]*?)<\\/h[1-4]>/i) || [])[1] || block.slice(0, 160));\n    if (h.length < 4) continue;'
          new = 'const h = clean((m[1].match(/<h[1-6][^>]*>([\\s\\S]*?)<\\/h[1-6]>/i) || [])[1] || block.slice(0, 160));\n    if (h.length < 4 || isGarbageEventTitle(h)) continue;'
          if old not in s: raise SystemExit('event heading target missing')
          s = s.replace(old, new, 1)

          marker = 'function dedupeEvents(items) {'
          helper = '''function isGarbageEventTitle(title) {
            const t = norm(title);
            return /^(?:events? from|upcoming events?|events search|search|today|calendar|winter spring|summer|fall|holiday season|skip to content|skip to footer)/i.test(t)
              || /(?:skip to content|skip to footer|the museum is open|special exhibits.*all year)/i.test(t)
              || /^(?:sun|mon|tue|wed|thu|fri|sat)\\s+\\d{1,2}\\s+/.test(t) && /\\bfeatured\\b/.test(t) && t.length > 140;
          }
          '''
          if marker not in s: raise SystemExit('event garbage marker missing')
          s = s.replace(marker, helper + marker, 1)

          s = s.replace('export { parseOrganizationPage, parseEvents, parseJobs, geographicEvidence, estimateDistance, parseHomeLocation };', 'export { parseOrganizationPage, parseEvents, parseJobs, parseNeoRlsJobs, geographicEvidence, estimateDistance, parseHomeLocation };', 1)
          s = s.replace('// Cloudflare deployment verification touch — validated 3.9.3 worker.', '// Cloudflare deployment verification touch — validated 3.9.5 source-specific parsers.', 1)

          p.write_text(s)
          PY

      - name: Syntax and parser smoke tests
        run: |
          node --check worker/index.js
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs, parseEvents } from './worker/index.js';
          const jobHtml = `<h2>Delivery Driver (Part Time) - Warren-Trumbull County Public Library</h2><div>The Warren-Trumbull County Public Library is seeking a dependable Delivery Driver. This part-time position is 25 hours per week in Warren, OH.</div><a href="https://mms.neo-rls.org/jobs/123">Read More</a><h2>Building Maintenance Worker (Part Time) - Warren Trumbull County Public Library</h2><div>This part-time position is 25 hours/week in Warren, Ohio.</div><a href="https://mms.neo-rls.org/jobs/124">Read More</a>`;
          const jobs = parseNeoRlsJobs(jobHtml, 'https://www.neo-rls.org/view_job_postings.php', ['welding','woodworking','museum','crafts'], 'Mesopotamia', 'OH', 30, {source:'NEO-RLS',partTime:true});
          if (jobs.length !== 2) throw new Error(`NEO-RLS smoke expected 2 jobs, got ${jobs.length}`);
          if (!jobs.every(x => x.source === 'NEO-RLS' && x.employmentType === 'Part-time')) throw new Error('NEO-RLS smoke metadata failed');
          const eventHtml = `<script type="application/ld+json">${JSON.stringify({"@type":"Event","name":"Apple Butter Festival and Ox Roast 2026","startDate":"2026-10-10","location":{"name":"Century Village Museum","address":{"streetAddress":"14653 E Park St","addressLocality":"Burton","addressRegion":"OH","postalCode":"44021"}},"description":"&lt;p&gt;Come stir apple butter &amp; enjoy the festival.&lt;/p&gt;"})}</script>`;
          const ev = parseEvents(eventHtml, 'https://centuryvillagemuseum.org/event/apple-butter-festival-and-ox-roast-2026/', ['festivals'], 'Mesopotamia', 'OH', {name:'Century Village Museum'}, 75);
          if (ev.events.length !== 1) throw new Error(`event smoke expected 1 event, got ${ev.events.length}`);
          if (ev.events[0].description.includes('<p>') || !ev.events[0].description.includes('&')) throw new Error('event description cleanup failed');
          console.log('3.9.5 parser smoke tests passed');
          JS

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.5 source-specific job and event parsers" || exit 0
          git push origin main
