name: Fix 3.9.3 runner 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported job condition
        shell: bash
        run: |
          if [ ! -f .github/patch-3.9.3.flag ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-3.9.3.yml')
          s = p.read_text()
          expr = '    if: ' + chr(36) + '{{ hashFiles(\'.github/patch-3.9.3.flag\') != \'\' }}\n'
          if expr in s:
              s = s.replace(expr, '', 1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-3.9.3.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove unsupported patch job condition"
          git push
