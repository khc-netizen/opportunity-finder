name: Apply discovery tuning
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[discovery-tuning]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/index.js')
          s=p.read_text()
          s=s.replace('const ORG_DISCOVERY_QUERY_LIMIT = 14;', 'const ORG_DISCOVERY_QUERY_LIMIT = 8;')
          s=s.replace('const ORG_VALIDATION_LIMIT = 18;', 'const ORG_VALIDATION_LIMIT = 12;')
          s=s.replace('const BUILD = "v3.9.11-search-filter";', 'const BUILD = "v3.9.12-discovery-budget";')
          needle='const LOCAL_REGION_RE = /\\b(?:ohio|trumbull|warren|northeast ohio|geauga|portage|ashtabula|mahoning|columbiana|summit|lake|cuyahoga)\\b/i;'
          insert=needle+'\nconst DISCOVERY_SIGNAL_RE = /\\b(?:association|society|museum|library|guild|club|chapter|shire|sca|blacksmith|blacksmiths|beekeep|beekeepers|reenact|history|historical|heritage|preservation|nature|conservation|arboretum|observatory|community|farm|homestead|park|volunteer)\\b/i;\nconst JOB_SIGNAL_RE = /\\b(?:job|jobs|career|careers|employment|hiring|position|apply|work|technician|welder|welding|fabricat|mechanic|warehouse|laborer|parks|grounds|recreation|museum|archaeology|custod|maintenance|delivery|transportation)\\b/i;'
          if needle not in s: raise SystemExit('anchor missing')
          s=s.replace(needle, insert, 1)
          old='for (const u of r.urls) {\n      if (acceptDiscoveryUrl(u, state)) orgCandidates.push({ url: u, query });\n    }'
          new='for (const u of r.urls) {\n      if (acceptDiscoveryUrl(u, state) && DISCOVERY_SIGNAL_RE.test(norm(u))) orgCandidates.push({ url: u, query });\n    }'
          if old not in s: raise SystemExit('org loop missing')
          s=s.replace(old,new,1)
          old='for (const u of r.urls) if (acceptDiscoveryUrl(u, state)) venueCandidates.push({ url: u, query });'
          new='for (const u of r.urls) if (acceptDiscoveryUrl(u, state) && (DISCOVERY_SIGNAL_RE.test(norm(u)) || VENUE_RE.test(norm(u)))) venueCandidates.push({ url: u, query });'
          if old not in s: raise SystemExit('venue loop missing')
          old='for (const u of r.urls.slice(0, 4)) {\n        if (!acceptDiscoveryUrl(u, state) || eventBudget.used >= eventBudget.limit) continue;'
          new='for (const u of r.urls.slice(0, 4)) {\n        if (!acceptDiscoveryUrl(u, state) || (!EVENT_RE.test(norm(u)) && !DISCOVERY_SIGNAL_RE.test(norm(u))) || eventBudget.used >= eventBudget.limit) continue;'
          if old not in s: raise SystemExit('event loop missing')
          s=s.replace(old,new,1)
          old='for (const u of r.urls.slice(0, JOB_WEB_VALIDATION_LIMIT)) {\n      if (budget.used >= budget.limit) break;\n      if (!acceptDiscoveryUrl(u, state) || CAREER_RE.test(u) || JOB_JUNK_HOST_RE.test(host(u))) continue;'
          new='for (const u of r.urls.slice(0, JOB_WEB_VALIDATION_LIMIT)) {\n      if (budget.used >= budget.limit) break;\n      if (!acceptDiscoveryUrl(u, state) || JOB_JUNK_HOST_RE.test(host(u)) || !JOB_SIGNAL_RE.test(norm(u))) continue;'
          if old not in s: raise SystemExit('job loop missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tune discovery budget and candidate filtering [discovery-tuning]"
          git push
