name: Inspect dance filters
on:
  push:
    branches: [fix/org-dance-and-local-noise]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          echo '--- DANCE_RE occurrences ---'
          grep -n -C 3 'DANCE_RE' worker/index.js || true
          echo '--- ORG validation area ---'
          grep -n -C 8 'organization-validation' worker/index.js | head -200 || true
