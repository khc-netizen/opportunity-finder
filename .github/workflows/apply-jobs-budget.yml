name: Apply jobs budget fix
on:
  push:
    branches: [fix/discovery-efficiency]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch jobs budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          marker = 'async function discoverJobs(interests, city, state, radius, partTime, env) {'
          head, tail = s.split(marker, 1)
          old = '  const budget = { used: 0, limit: Number(env?.DISCOVERY_FETCH_LIMIT || 72) };'
          new = '  const budget = { used: 0, limit: Math.min(SAFE_FETCH_LIMIT, Number(env?.DISCOVERY_FETCH_LIMIT || 72)) };'
          if old not in tail:
              raise SystemExit('Expected jobs budget declaration not found')
          tail = tail.replace(old, new, 1)
          p.write_text(head + marker + tail)
          PY
      - name: Validate source
        run: |
          git diff --check
          node --check worker/index.js
          grep -A2 'async function discoverJobs' worker/index.js | grep -q 'SAFE_FETCH_LIMIT'
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Apply safe fetch cap to job discovery"
          git push origin HEAD:fix/discovery-efficiency
