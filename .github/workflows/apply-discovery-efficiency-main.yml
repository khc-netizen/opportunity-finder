name: Apply discovery efficiency patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          reps = [
          ('const VERSION = "3.9.7";\nconst BUILD = "v3.9.8-broader-org-discovery";\nconst SEARCH_LIMIT = 10;\nconst ORG_DISCOVERY_QUERY_LIMIT = 14;\nconst ORG_VALIDATION_LIMIT = 18;\nconst VENUE_DISCOVERY_QUERY_LIMIT = 2;\nconst VENUE_VALIDATION_LIMIT = 2;\nconst PAGE_LIMIT = 72;', 'const VERSION = "3.9.8";\nconst BUILD = "v3.9.9-discovery-efficiency";\nconst SEARCH_LIMIT = 10;\nconst ORG_DISCOVERY_QUERY_LIMIT = 14;\nconst ORG_VALIDATION_LIMIT = 18;\nconst VENUE_DISCOVERY_QUERY_LIMIT = 2;\nconst VENUE_VALIDATION_LIMIT = 2;\nconst SAFE_FETCH_LIMIT = 44;\nconst EVENT_FETCH_LIMIT = 8;\nconst USA_DISCOVERY_ANCHOR_LIMIT = 6;\nconst USA_DISCOVERY_QUERY_LIMIT = 5;\nconst JOB_WEB_VALIDATION_LIMIT = 1;\nconst PAGE_LIMIT = 72;'),
          ('const JUNK_HOST_RE = /(?:facebook|instagram|linkedin|youtube|tiktok|pinterest|x\\.com|twitter|wikipedia|yelp|tripadvisor|google|googleusercontent|googleapis|classroom|drive|accounts|menards|usps|17track|fedex)\\./i;', 'const JUNK_HOST_RE = /(?:facebook|instagram|linkedin|youtube|tiktok|pinterest|x\\.com|twitter|wikipedia|yelp|tripadvisor|google|googleusercontent|googleapis|classroom|drive|accounts|menards|usps|17track|fedex)\\./i;\nconst LOW_VALUE_HOST_RE = /(?:britannica\\.com|worldhistory\\.org|merriam-webster\\.com|almanac\\.com|petmd\\.com|a-z-animals\\.com|newsbreak\\.com|ground\\.news|raynetoday\\.com|restaurantji\\.com|tvtv\\.us|weather\\.com|history\\.com|pacnyc\\.org|centurycommunities\\.com|centurymartialarts\\.com|centuryhouse\\.biz)$/i;\nconst LOW_VALUE_PATH_RE = /\\/(?:dictionary|article|articles|news|weather|recipes?|podcasts?|restaurant-reviews?)\\b/i;'),
          ('    if (JUNK_HOST_RE.test(x.hostname)) return false;\n    if (isObviousOutOfState(x.href, state)) return false;\n    return true;', '    if (JUNK_HOST_RE.test(x.hostname)) return false;\n    if (LOW_VALUE_HOST_RE.test(x.hostname) || LOW_VALUE_PATH_RE.test(x.pathname)) return false;\n    if (isObviousOutOfState(x.href, state)) return false;\n    return true;'),
          ('function dedupeCandidateUrls(arr) { const m = new Map(); for (const x of arr) if (!m.has(urlKey(x.url))) m.set(urlKey(x.url), x); return [...m.values()]; }', 'function discoveryCandidateScore(c) { const t = norm(c?.url || ""); let s = c?.trusted ? 1000 : 0; if (/\\b(?:ohio|oh|trumbull|warren|northeast ohio|geauga|portage|ashtabula|mahoning|columbiana|summit|lake|cuyahoga)\\b/.test(t)) s += 40; if (/\\b(?:association|society|museum|guild|club|chapter|shire|sca|blacksmith|beekeep|reenact|history|heritage|preservation|nature|conservation)\\b/.test(t)) s += 20; return s; }\nfunction dedupeCandidateUrls(arr) { const m = new Map(); for (const x of arr) if (!m.has(urlKey(x.url))) m.set(urlKey(x.url), x); return [...m.values()]; }\nfunction prioritizeCandidateUrls(arr) { return dedupeCandidateUrls(arr).sort((a, b) => discoveryCandidateScore(b) - discoveryCandidateScore(a)); }'),
          ('const uniqueOrgUrls = dedupeCandidateUrls(orgCandidates).slice(0, ORG_VALIDATION_LIMIT);', 'const uniqueOrgUrls = prioritizeCandidateUrls(orgCandidates).slice(0, ORG_VALIDATION_LIMIT);'),
          ('for (const c of dedupeCandidateUrls(venueCandidates).slice(0, VENUE_VALIDATION_LIMIT)) {', 'for (const c of prioritizeCandidateUrls(venueCandidates).slice(0, VENUE_VALIDATION_LIMIT)) {'),
          ('const eventBudget = { used: 0, limit: Math.min(10, Math.max(0, budget.limit - budget.used)) };', 'const eventBudget = { used: 0, limit: Math.min(EVENT_FETCH_LIMIT, Math.max(0, budget.limit - budget.used)) };'),
          ('for (const u of r.urls.slice(0, 5)) {', 'for (const u of r.urls.slice(0, JOB_WEB_VALIDATION_LIMIT)) {'),
          ('  const usaAnchors = buildUSADiscoveryAnchors(city, state);\n  const usaQueries = buildUSAQueries(interests);', '  const usaAnchors = buildUSADiscoveryAnchors(city, state).slice(0, USA_DISCOVERY_ANCHOR_LIMIT);\n  const usaQueries = buildUSAQueries(interests).slice(0, USA_DISCOVERY_QUERY_LIMIT);'),
          ('function buildUSADiscoveryAnchors(city, state) {\n  if (!/^(OH|Ohio)$/i.test(state) || !/^(Mesopotamia|Warren)$/i.test(city)) return [{ label: `${city}, ${state}`, city, state }];\n  return [\n    { label: "Mesopotamia", city: "Mesopotamia", state: "OH" },\n    { label: "Warren", city: "Warren", state: "OH" },\n    { label: "Youngstown", city: "Youngstown", state: "OH" },\n    { label: "Ravenna", city: "Ravenna", state: "OH" },\n    { label: "Ashtabula", city: "Ashtabula", state: "OH" },\n    { label: "Akron", city: "Akron", state: "OH" },\n    { label: "Canton", city: "Canton", state: "OH" },\n    { label: "Cleveland", city: "Cleveland", state: "OH" }\n  ];\n}', 'function buildUSADiscoveryAnchors(city, state) {\n  if (!/^(OH|Ohio)$/i.test(state) || !/^(Mesopotamia|Warren)$/i.test(city)) return [{ label: `${city}, ${state}`, city, state }];\n  return [\n    { label: "Mesopotamia", city: "Mesopotamia", state: "OH" },\n    { label: "Warren", city: "Warren", state: "OH" },\n    { label: "Youngstown", city: "Youngstown", state: "OH" },\n    { label: "Ravenna", city: "Ravenna", state: "OH" },\n    { label: "Akron", city: "Akron", state: "OH" },\n    { label: "Ashtabula", city: "Ashtabula", state: "OH" }\n  ];\n}'),
          ('function buildJobQueries(interests, city, state) { const base = interestBase(interests).slice(0, 6), p = `"${city}" ${state}`; return [...new Set(base.map(x => `"${x}" ${p} (jobs OR careers OR employment OR hiring) -dance`))].slice(0, 6); }', 'function buildJobQueries(interests, city, state) {\n  const p = `"${city}" ${state}`;\n  const broad = ["maintenance facilities technician laborer", "welding fabrication mechanic equipment", "warehouse material handling delivery transportation", "parks grounds recreation natural resources", "museum historic preservation library", "custodial facilities building maintenance"];\n  const specific = interests.slice(0, 4).map(x => clean(x)).filter(Boolean);\n  const base = interests.length ? [...specific, ...broad.slice(0, 6 - specific.length)] : broad;\n  return [...new Set(base.map(x => `"${x}" ${p} (jobs OR careers OR employment OR hiring) -dance`))].slice(0, 6);\n}')
          ]
          for old, new in reps:
              if old not in s: raise SystemExit('Missing expected source text: ' + old[:180])
              s = s.replace(old, new, 1)
          marker = 'async function discoverJobs(interests, city, state, radius, partTime, env) {'
          head, tail = s.split(marker, 1)
          old = '  const budget = { used: 0, limit: Number(env?.DISCOVERY_FETCH_LIMIT || 72) };'
          new = '  const budget = { used: 0, limit: Math.min(SAFE_FETCH_LIMIT, Number(env?.DISCOVERY_FETCH_LIMIT || 72)) };'
          if old not in tail: raise SystemExit('Missing jobs budget declaration')
          tail = tail.replace(old, new, 1)
          s = head + marker + tail
          old = 'async function discover(interests, city, state, radius, env) {\n  const budget = { used: 0, limit: Number(env?.DISCOVERY_FETCH_LIMIT || 72) };'
          new = 'async function discover(interests, city, state, radius, env) {\n  const budget = { used: 0, limit: Math.min(SAFE_FETCH_LIMIT, Number(env?.DISCOVERY_FETCH_LIMIT || 72)) };'
          if old not in s: raise SystemExit('Missing discovery budget declaration')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate source
        run: |
          git diff --check
          node --check worker/index.js
          grep -q 'v3.9.9-discovery-efficiency' worker/index.js
          grep -q 'SAFE_FETCH_LIMIT = 44' worker/index.js
          grep -q 'USA_DISCOVERY_ANCHOR_LIMIT = 6' worker/index.js
          grep -q 'JOB_WEB_VALIDATION_LIMIT = 1' worker/index.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('worker/index.js').read_text()
          marker = 'async function discoverJobs(interests, city, state, radius, partTime, env) {'
          assert 'SAFE_FETCH_LIMIT' in s.split(marker,1)[1].split('const diagnostics',1)[0]
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Improve discovery efficiency and job candidate quality"
          git push origin main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-discovery-efficiency-main.yml
          git commit -m "Remove temporary discovery patch workflow"
          git push origin main
# trigger
