name: One-off trusted event source patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patch flag
        id: flag
        run: test -f .github/patch-events.flag
      - name: Patch event discovery
        if: steps.flag.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          marker = 'const DANCE_RE ='
          insert = '''const BUILTIN_EVENT_SOURCES = [\n  { url: "https://centuryvillagemuseum.org/event/", name: "Century Village Museum" },\n  { url: "https://centuryvillagemuseum.org/events-calendar/", name: "Century Village Museum" }\n];\n'''
          if 'const BUILTIN_EVENT_SOURCES' not in s:
              s = s.replace(marker, insert + marker, 1)
          start = s.index('  // Stage 3: discover events from validated organization/venue anchors only.')
          end = s.index('  const uniqueEvents =', start)
          new = '''  // Stage 3: trusted event sources first, then validated organization/venue anchors.\n  // This makes event discovery resilient when search-engine results are sparse or noisy.\n  const eventBudget = { used: 0, limit: Math.min(24, Math.max(0, budget.limit - budget.used)) };\n  const events = [];\n  const trustedEventSources = [...BUILTIN_EVENT_SOURCES, ...listEnv(env, "EVENT_SOURCES").map(url => ({ url, name: "configured event source" }))];\n  for (const source of trustedEventSources) {\n    if (eventBudget.used >= eventBudget.limit) break;\n    const pr = await fetchText(source.url, {}, eventBudget);\n    const d = { stage: "trusted-event-source", organization: source.name, url: source.url, ok: pr.ok, status: pr.status, accepted: 0, rejected: null };\n    if (!pr.ok) { d.rejected = pr.error || `HTTP ${pr.status}`; diagnostics.push(d); continue; }\n    const org = { name: source.name, url: source.url };\n    const found = parseEvents(pr.text, source.url, interests, city, state, org, radius);\n    d.accepted = found.events.length; d.rejected = found.events.length ? null : found.rejectReason;\n    diagnostics.push(d); events.push(...found.events);\n  }\n\n  // Supplemental event discovery from validated anchors.\n  for (const org of anchors.slice(0, 8)) {\n    if (eventBudget.used >= eventBudget.limit) break;\n    for (const query of buildEventQueries(org, interests, city, state).slice(0, 2)) {\n      if (eventBudget.used >= eventBudget.limit) break;\n      const r = await searchWeb(query, env, eventBudget);\n      diagnostics.push({ stage: "event-search", organization: org.name, query, ok: r.ok, status: r.status, candidates: r.urls.length, milliseconds: r.milliseconds, bytes: r.bytes, error: r.ok ? null : r.error });\n      for (const u of r.urls.slice(0, 4)) {\n        if (!acceptDiscoveryUrl(u, state) || eventBudget.used >= eventBudget.limit) continue;\n        const pr = await fetchText(u, {}, eventBudget);\n        const d = { stage: "event-validation", organization: org.name, url: u, ok: pr.ok, status: pr.status, accepted: 0, rejected: null };\n        if (!pr.ok) { d.rejected = pr.error || `HTTP ${pr.status}`; diagnostics.push(d); continue; }\n        const found = parseEvents(pr.text, u, interests, city, state, org, radius);\n        d.accepted = found.events.length; d.rejected = found.events.length ? null : found.rejectReason; diagnostics.push(d); events.push(...found.events);\n      }\n    }\n  }\n\n'''
          s = s[:start] + new + s[end:]
          s = s.replace('const VERSION = "3.9.1";', 'const VERSION = "3.9.2";')
          s = s.replace('const BUILD = "v3.9.1-jobs-source-priority";', 'const BUILD = "v3.9.2-trusted-event-sources";')
          p.write_text(s)
          PY
          node --check worker/index.js
          rm -f .github/patch-events.flag .github/workflows/one-off-event-source-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js .github
          git commit -m "feat: prioritize trusted event sources"
          git push
