name: Verify 3.9.6 live deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-3.9.6-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Worker
        run: |
          set -e
          diag=$(curl -fsSL --max-time 20 'https://opportunity-finder-v2.khc-comm.workers.dev/test')
          echo "$diag"
          echo "$diag" | grep -q '"version":"3.9.6"'
          jobs=$(curl -fsSL --max-time 45 'https://opportunity-finder-v2.khc-comm.workers.dev/jobs?interests=museum%2Cartifact%20conservation%2Chistoric%20preservation%2Carchaeology%2Cbike%20mechanic%2Cwelding%2Cfabrication%2Cwoodworking%2Cartisan%2Ccrafts&home=Mesopotamia%2C%20Ohio&city=Mesopotamia&state=OH&radius=30&partTime=true')
          echo "$jobs" | head -c 12000
          echo
          echo "$jobs" | grep -q '"source":"NEO-RLS"\|"source": "NEO-RLS"'
          ! echo "$jobs" | grep -q '"title":"JOBLine"\|"title": "JOBLine"'
          echo 'Live 3.9.6 Worker and NEO-RLS parser verified.'
