name: Inspect USAJOBS implementation
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show USAJOBS code
        run: |
          echo '--- USAJOBS references ---'
          grep -n -i -E 'USAJOBS|usajobs|Authorization-Key|authorization-key' worker/index.js || true
          echo '--- live worker test ---'
          curl -fsS --max-time 30 'https://opportunity-finder-v2.khc-comm.workers.dev/test' | tee /tmp/test.json || true
          echo
          echo '--- live USAJOBS diagnostics ---'
          curl -fsS --max-time 60 'https://opportunity-finder-v2.khc-comm.workers.dev/jobs?city=Mesopotamia&state=OH&radius=30&partTime=true&interests=museum,archaeology,welding,woodworking' | python -c 'import json,sys; j=json.load(sys.stdin); print(json.dumps({"build":j.get("build"),"counts":j.get("counts"),"usa": [x for x in j.get("diagnostics",[]) if x.get("stage")=="usajobs"],"sources": sorted(set(x.get("source") for x in j.get("items",[]) if x.get("source")))}, indent=2))' || true
