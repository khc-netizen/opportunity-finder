name: Patch broader organization discovery

on:
  push:
    branches: [fix/broader-org-discovery]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/broader-org-discovery
          fetch-depth: 0

      - name: Apply targeted organization discovery patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("worker/index.js")
          s = path.read_text()

          def once(pattern, replacement, label, flags=0):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"Expected exactly one match for {label}, got {n}")
              s = s2

          once(r'const SEARCH_LIMIT = 10;\nconst PAGE_LIMIT = 72;',
               'const SEARCH_LIMIT = 10;\nconst ORG_DISCOVERY_QUERY_LIMIT = 14;\nconst ORG_VALIDATION_LIMIT = 18;\nconst VENUE_DISCOVERY_QUERY_LIMIT = 2;\nconst VENUE_VALIDATION_LIMIT = 2;\nconst PAGE_LIMIT = 72;',
               'discovery limits')
          once(r'return \[\.\.\.new Set\(qs\)\]\.slice\(0, SEARCH_LIMIT\);\n\}',
               'return [...new Set(qs)].slice(0, ORG_DISCOVERY_QUERY_LIMIT);\n}',
               'organization query limit')
          once(r'const uniqueOrgUrls = dedupeCandidateUrls\(orgCandidates\)\.slice\(0, 14\);',
               'const uniqueOrgUrls = dedupeCandidateUrls(orgCandidates).slice(0, ORG_VALIDATION_LIMIT);',
               'organization validation limit')
          once(r'for \(const query of buildVenueQueries\(interests, city, state\)\) \{',
               'for (const query of buildVenueQueries(interests, city, state).slice(0, VENUE_DISCOVERY_QUERY_LIMIT)) {',
               'venue query limit')
          once(r'for \(const c of dedupeCandidateUrls\(venueCandidates\)\.slice\(0, 6\)\) \{',
               'for (const c of dedupeCandidateUrls(venueCandidates).slice(0, VENUE_VALIDATION_LIMIT)) {',
               'venue validation limit')
          once(r'// Cloudflare\'s subrequest ceiling is lower than the configurable fetch budget\.\n  // Organization/venue discovery can consume up to 36 calls, so keep event discovery\n  // capped at 14 to stay below the 50-subrequest ceiling\.\n  const eventBudget = \{ used: 0, limit: Math\.min\(14, Math\.max\(0, budget\.limit - budget\.used\)\) \};',
               '// Broader organization discovery uses the saved venue budget. Keep the total\n  // organization/venue pass at roughly 36 calls and leave headroom for events under\n  // Cloudflare\'s observed subrequest ceiling.\n  const eventBudget = { used: 0, limit: Math.min(10, Math.max(0, budget.limit - budget.used)) };',
               'event budget')
          once(r'function interestBase\(interests\) \{\n  return interests\.length \? interests\.slice\(0, 8\) : \[[^\]]+\];\n\}',
               'function interestBase(interests) {\n  return interests.length ? interests.slice(0, 8) : ["local history", "museums", "historical societies", "beekeeping", "blacksmithing", "reenactment", "living history", "SCA", "Society for Creative Anachronism", "shire", "guilds", "nature conservation", "astronomy", "cycling trails", "gardening horticulture", "traditional crafts", "sportsmen"];\n}',
               'organization discovery vocabulary')
          once(r'const VERSION = "3\.9\.6";\nconst BUILD = "v3\.9\.7-usajobs-local-parttime";',
               'const VERSION = "3.9.7";\nconst BUILD = "v3.9.8-broader-org-discovery";',
               'version/build')

          path.write_text(s)
          PY

      - name: Validate source
        run: |
          git diff --check
          node --check worker/index.js
          git diff -- worker/index.js
          git diff --stat

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/patch-org-discovery.yml PR9_TRIGGER.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js .github/workflows/patch-org-discovery.yml PR9_TRIGGER.txt
          git commit -m "Broaden local organization discovery"
          git push origin HEAD:fix/broader-org-discovery
