name: Fix USAJOBS local part-time search
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted USAJOBS improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = 'url.searchParams.set("Keyword", query); url.searchParams.set("LocationName", `${city}, ${state}`); url.searchParams.set("Radius", String(radius)); url.searchParams.set("ResultsPerPage", "20");'
          new = 'url.searchParams.set("Keyword", query); const usaLocation = /^(Mesopotamia)$/i.test(city) && /^(OH|Ohio)$/i.test(state) ? "Mesopotamia, Ohio;Warren, Ohio" : `${city}, ${state}`; url.searchParams.set("LocationName", usaLocation); url.searchParams.set("Radius", String(radius)); url.searchParams.set("ResultsPerPage", "20"); if (partTime) url.searchParams.set("PositionScheduleTypeCode", "2");'
          if old not in s:
              raise SystemExit('Expected USAJOBS query line was not found; refusing to patch.')
          s = s.replace(old, new, 1)
          old_build = 'const BUILD = "v3.9.6-usajobs-auth-header-fix";'
          if old_build not in s:
              raise SystemExit('Expected build string was not found; refusing to patch.')
          s = s.replace(old_build, 'const BUILD = "v3.9.7-usajobs-local-parttime";', 1)
          p.write_text(s)
          PY
          node --check worker/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Improve USAJOBS local part-time search'
          git push
      - name: Verify live Worker
        run: |
          set -e
          for i in $(seq 1 12); do
            TEST=$(curl -fsS --max-time 30 'https://opportunity-finder-v2.khc-comm.workers.dev/test' || true)
            BUILD=$(printf '%s' "$TEST" | python -c 'import json,sys; print(json.load(sys.stdin).get("build", ""))' 2>/dev/null || true)
            echo "Attempt $i/12: $BUILD"
            if [ "$BUILD" = "v3.9.7-usajobs-local-parttime" ]; then
              JOBS=$(curl -fsS --max-time 90 'https://opportunity-finder-v2.khc-comm.workers.dev/jobs?city=Mesopotamia&state=OH&radius=30&partTime=true&interests=museum,archaeology,welding,woodworking')
              printf '%s' "$JOBS" | python -c 'import json,sys; j=json.load(sys.stdin); u=[x for x in j.get("diagnostics",[]) if x.get("stage")=="usajobs"]; items=[x for x in j.get("items",[]) if x.get("source")=="USAJOBS"]; print(json.dumps({"build":j.get("build"),"counts":j.get("counts"),"usa":u,"usa_items":len(items),"usa_titles":[x.get("title") for x in items[:10]]},indent=2)); assert u and all(x.get("ok") and x.get("status")==200 for x in u), u'
              echo 'USAJOBS LOCAL/PART-TIME VERIFICATION PASSED'
              exit 0
            fi
            sleep 30
          done
          exit 1
