name: Emergency Worker restore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[emergency-restore]') && !contains(github.event.head_commit.message, 'Remove emergency Worker restore') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good Worker
        run: git show b08c63de1e7d6295fdf0b3ef9f236e6643dede61:worker/index.js > worker/index.js
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Emergency restore known-good Worker [emergency-restore]"
          git push
