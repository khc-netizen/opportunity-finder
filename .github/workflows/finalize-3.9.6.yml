name: Finalize 3.9.6 worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-3.9.6.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair dynamic geographic regexes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          replacements = [
              (r'new RegExp("\\b" + escapeRe(k.split(",")[0]) + "\\b", "i")', r'new RegExp("\\\\b" + escapeRe(k.split(",")[0]) + "\\\\b", "i")'),
              (r'new RegExp("\\b" + escapeRe(norm(city)) + "\\b", "i")', r'new RegExp("\\\\b" + escapeRe(norm(city)) + "\\\\b", "i")'),
              (r'new RegExp(".{0,80}\\b" + escapeRe(city) + "\\b.{0,80}", "i")', r'new RegExp(".{0,80}\\\\b" + escapeRe(city) + "\\\\b.{0,80}", "i")'),
              (r'new RegExp(`\\b${escapeRe(city)}\\b`, "i")', r'new RegExp("\\\\b" + escapeRe(city) + "\\\\b", "i")')
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          s = s.replace('const BUILD = "v3.9.6-neo-rls-geographic-validation";', 'const BUILD = "v3.9.6-neo-rls-geographic-validation-final";', 1)
          p.write_text(s)
          PY
          node --check worker/index.js
      - name: Validate parser and live NEO-RLS source
        run: |
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs, estimateDistance } from './worker/index.js';
          if (estimateDistance('Mesopotamia, OH','Warren, OH') !== 18) throw new Error('Warren distance failed');
          if (estimateDistance('Mesopotamia, OH','Garrettsville, OH') !== 14) throw new Error('Garrettsville distance failed');
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const html = await r.text();
          const jobs = parseNeoRlsJobs(html,'https://www.neo-rls.org/view_job_postings.php',['museum','artifact conservation','historic preservation','archaeology','bike mechanic','welding','fabrication','woodworking','artisan','crafts'],'Mesopotamia','OH',30,{source:'NEO-RLS',partTime:true});
          console.log('NEO-RLS',r.status,html.length,'bytes',jobs.length,'jobs');
          for (const j of jobs) console.log(j.title,'|',j.location,'|',j.distanceMiles);
          if (jobs.length < 5) throw new Error('Expected at least 5 local part-time NEO-RLS jobs');
          JS
      - name: Commit final worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.6 final NEO-RLS geographic repair" || exit 0
          git push origin main
