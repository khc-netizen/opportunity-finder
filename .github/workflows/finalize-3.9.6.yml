name: Finalize 3.9.6 worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-3.9.6.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate final worker and force deployment touch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          cs = s.index('function cityKey(')
          ce = s.index('function estimateDistance(', cs)
          city_fn = '''function cityKey(text) {
            const t = norm(text);
            const padded = ` ${t} `;
            for (const k of Object.keys(CITY_COORDS).sort((a,b) => b.length - a.length)) {
              const name = norm(k.split(",")[0]);
              if (padded.includes(` ${name} `)) return k;
            }
            return null;
          }
          '''
          s = s[:cs] + city_fn + s[ce:]
          gs = s.index('function geographicEvidence(')
          ge = s.index('function extractLocation(', gs)
          geo_fn = '''function geographicEvidence(text, city, state) {
            const t = norm(text), padded = ` ${t} `;
            if (/^(OH|Ohio)$/i.test(state)) {
              const hasOhio = /\\bohio\\b/.test(t);
              const hasOhioAbbr = /\\boh\\b/.test(t);
              const hasState = hasOhio || hasOhioAbbr;
              const hasCity = !!city && padded.includes(` ${norm(city)} `);
              const hasCountyOrRegion = /\\b(?:trumbull county|trumbull|warren|northeast ohio|geauga county|geauga|portage county|portage|ashtabula county|ashtabula|mahoning county|mahoning|columbiana county|columbiana|summit county|summit|lake county|lake|cuyahoga county|cuyahoga)\\b/.test(t);
              let score = 0;
              if (hasState) score += 45;
              if (hasCity && hasState) score += 35;
              if (hasCountyOrRegion && hasState) score += 20;
              return { score: Math.min(100, score), hasOhio, hasOhioAbbr, hasState, hasCity, hasCountyOrRegion };
            }
            const wantedState = norm(state);
            const hasState = !!wantedState && padded.includes(` ${wantedState} `);
            const hasCity = !!city && padded.includes(` ${norm(city)} `);
            return { score: (hasState ? 50 : 0) + (hasCity && hasState ? 50 : 0), hasState, hasCity };
          }
          '''
          s = s[:gs] + geo_fn + s[ge:]
          s = s.replace('const BUILD = "v3.9.6-neo-rls-geographic-validation-final";', 'const BUILD = "v3.9.6-neo-rls-geographic-validation-final2";', 1)
          p.write_text(s)
          PY
          node --check worker/index.js
          node --input-type=module <<'JS'
          import { parseNeoRlsJobs, estimateDistance } from './worker/index.js';
          if (estimateDistance('Mesopotamia, OH','Warren, OH') !== 18) throw new Error('Warren distance failed');
          if (estimateDistance('Mesopotamia, OH','Garrettsville, OH') !== 14) throw new Error('Garrettsville distance failed');
          const r = await fetch('https://www.neo-rls.org/view_job_postings.php');
          const jobs = parseNeoRlsJobs(await r.text(),'https://www.neo-rls.org/view_job_postings.php',['museum','artifact conservation','historic preservation','archaeology','bike mechanic','welding','fabrication','woodworking','artisan','crafts'],'Mesopotamia','OH',30,{source:'NEO-RLS',partTime:true});
          console.log('Validated live NEO-RLS jobs:', jobs.length);
          for (const j of jobs) console.log(j.title,'|',j.location,'|',j.distanceMiles);
          if (jobs.length < 5) throw new Error('Expected at least 5 local part-time NEO-RLS jobs');
          JS
      - name: Commit worker deployment touch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Phase 3.9.6 force final Cloudflare worker deployment" || exit 0
          git push origin main
